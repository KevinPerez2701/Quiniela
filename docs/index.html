// ── DETALLE JUGADOR ────────────────────────────────────────────────────────────
// Para el jugador seleccionado muestra, partido a partido (solo los que ya tienen
// resultado cargado en data.json), el resultado real, el pronóstico del jugador y
// los puntos que sumó, con el total acumulado "hasta el momento" al final.

// Clasifica una columna de "equipo clasificado / honor" en su ronda. El orden
// importa: los rótulos largos ("Dieciseisavofinalista") contienen "finalista", así
// que las pruebas específicas deben evaluarse antes que /Finalista/.
function classifyQualCol(label) {
  const SEGS = [
    [/Dieciseisavofinalista/i, 'r32',    'Clasificados a 1/16 de Final',   1],
    [/Octavofinalista/i,       'r16',    'Clasificados a Octavos de Final', 2],
    [/Cuartofinalista/i,       'r8',     'Clasificados a Cuartos de Final', 3],
    [/Semifinalista/i,         'r4',     'Clasificados a Semifinales',      4],
    [/Finalista/i,             'rfinal', 'Clasificados a la Final',         5],
    [/puesto-\d/i,             'r34',    'Clasificados a 3er/4to puesto',   6],
    [/(Campe|Subcampe|puesto|Bota|Bal)/i, 'honor', 'Cuadro de Honor',      7],
  ];
  for (const [test, key, name, order] of SEGS) if (test.test(label)) return { key, name, order };
  return null;
}

// Construye los índices que usa esta vista a partir de los datos cargados.
function buildPlayerDetailIndex(data) {
  // Normaliza el nombre del jugador para cruzarlo entre bloques: la hoja CLAS a
  // veces trae espacios sobrantes (p. ej. "jaidali ") mientras que el bloque
  // diario viene recortado ("jaidali"), lo que rompería la unión por nombre.
  const norm = s => (s == null ? '' : String(s).trim());

  FIXTURE_ALL = data.fixture || [];
  FIXTURE_BY_NAME = {};
  FIXTURE_ALL.forEach(m => { FIXTURE_BY_NAME[m.home + '-' + m.away] = m; });

  CLAS_BY_NAME = {};
  (data.clas?.players || []).forEach(p => { CLAS_BY_NAME[norm(p.jugador)] = p; });

  // Para cada jugador, une su pronóstico (predictions) con sus puntos (clas) por
  // día, cruzando por nombre (predictions y clas vienen en orden distinto). De cada
  // columna se deriva, según su tipo:
  //   • PLAYER_MATCH_DATA  -> partidos reales del fixture (incluye cruces KO).
  //   • PLAYER_POS_DATA    -> posiciones de grupo ("1° GRUPO A").
  //   • PLAYER_QUAL_DATA   -> equipos clasificados por ronda + Cuadro de Honor.
  PLAYER_MATCH_DATA = {};
  PLAYER_POS_DATA = {};
  PLAYER_QUAL_DATA = {};
  PLAYER_KO_DATA = {};
  (data.daily || []).forEach(day => {
    const ptsByPlayer = {};
    (day.clas || []).forEach(c => { ptsByPlayer[norm(c.jugador)] = c.pts || []; });
    (day.predictions || []).forEach(pr => {
      const key = norm(pr.jugador);
      const pts = ptsByPlayer[key] || [];
      const store = PLAYER_MATCH_DATA[key] || (PLAYER_MATCH_DATA[key] = {});
      let fsIdx = 0;   // contador de columnas de fase final (Finalista / 3-4 puesto) del día
      (day.matches || []).forEach((name, i) => {
        const pred = (pr.preds || [])[i] ?? null;
        const pt = pts[i] || 0;
        // 0) Cruce eliminatorio pronosticado (día de fase, pred "A-B·Signo|Marcador"):
        //    va a PLAYER_KO_DATA por ronda, con los puntos que ya calculó el Excel
        //    (que premian el cruce dondequiera que ocurra, sin importar la llave).
        //    No hace return: si la fila además es un partido real, alimenta store.
        if (!day.date && pred && String(pred).indexOf('·') >= 0) {
          const rounds = PLAYER_KO_DATA[key] || (PLAYER_KO_DATA[key] = []);
          let round = rounds[rounds.length - 1];
          if (!round || round.ref !== day.ref) {
            round = { ref: day.ref, label: day.label, rows: [] };
            rounds.push(round);
          }
          round.rows.push({ pred, pts: pt });
        }
        // 1) Partido real del fixture (grupos o cruce eliminatorio)
        if (name in FIXTURE_BY_NAME) {
          store[name] = { pred, pts: pt };
          return;
        }
        // 2) Posición de grupo: "1° GRUPO A" (solo en días con fecha 24–27/06)
        const mPos = /^(\d+)\D*GRUPO\s+([A-L])/i.exec(name);
        if (mPos) {
          const grp = mPos[2].toUpperCase();
          const byGrp = PLAYER_POS_DATA[key] || (PLAYER_POS_DATA[key] = {});
          (byGrp[grp] = byGrp[grp] || []).push({ pos: +mPos[1], predTeam: pred, pts: pt });
          return;
        }
        // 3) Equipo clasificado / Cuadro de Honor (columnas de fase sin fecha)
        if (!day.date && pred && String(pred).indexOf('·') < 0) {
          let seg = classifyQualCol(name);
          if (!seg) return;
          // La fase final viene mal rotulada en el Excel (aparece "Finalista-2" donde
          // debería decir "3-4 puesto-2"). Las 4 columnas de fase final del día de
          // Semifinales se reparten por posición: las 2 primeras al 3er/4to puesto y
          // las 2 siguientes a la Final (estructura real: 2 + 2, no 3 + 1).
          if (seg.key === 'rfinal' || seg.key === 'r34') {
            seg = (fsIdx < 2)
              ? { key: 'r34',    name: 'Clasificados a 3er/4to puesto', order: 6 }
              : { key: 'rfinal', name: 'Clasificados a la Final',       order: 5 };
            fsIdx++;
          }
          const bySeg = PLAYER_QUAL_DATA[key] || (PLAYER_QUAL_DATA[key] = {});
          const bucket = bySeg[seg.key] || (bySeg[seg.key] = { name: seg.name, order: seg.order, items: [] });
          bucket.items.push({ label: name, predTeam: pred, pts: pt });
        }
      });
    });
  });

  ALL_PLAYERS = (data.clas?.players || [])
    .map(p => norm(p.jugador))
    .sort((a, b) => a.localeCompare(b, 'es'));
  // Conservar selección previa si sigue existiendo; si no, el primero.
  if (!ALL_PLAYERS.includes(playerDetailSel)) playerDetailSel = ALL_PLAYERS[0] || '';
}

function signFromGoals(gh, ga) { return gh > ga ? '1' : gh < ga ? '2' : 'X'; }

function signBadge(sign) {
  const cls = sign === '1' ? 'sign-1' : sign === 'X' ? 'sign-X' : 'sign-2';
  return `<span class="res-sign ${cls}">${h(sign)}</span>`;
}

function renderPlayerDetail() {
  const el = document.getElementById('player-detail-content');
  el.innerHTML = '';
  if (!ALL_PLAYERS.length) { el.innerHTML = emptyState('Sin datos disponibles.'); return; }

  // Cabecera con selector de jugador
  const header = document.createElement('div');
  header.className = 'daily-header';
  header.innerHTML = `Selecciona jugador:&nbsp;`;
  const sel = document.createElement('select');
  sel.className = 'day-select';
  ALL_PLAYERS.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === playerDetailSel) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => { playerDetailSel = e.target.value; renderPlayerDetail(); });
  header.appendChild(sel);
  el.appendChild(header);

  // Control segmentado: vistas del jugador seleccionado
  const views = [
    ['partidos',     '⚽ Fase de Grupos'],
    ['ko',           '⚔️ Fase KO'],
    ['posiciones',   '📊 Posición Grupos'],
    ['clasificados', '🏅 Equipos Clasificados'],
    ['honor',        '🏆 Cuadro de Honor'],
  ];
  const seg = document.createElement('div');
  seg.className = 'pd-views';
  views.forEach(([key, label]) => {
    const b = document.createElement('button');
    b.className = 'pd-view-btn' + (playerDetailView === key ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', () => { playerDetailView = key; renderPlayerDetail(); });
    seg.appendChild(b);
  });
  el.appendChild(seg);

  const body = document.createElement('div');
  el.appendChild(body);
  if (playerDetailView === 'posiciones')        renderPDPositions(body, playerDetailSel);
  else if (playerDetailView === 'ko')           renderPDKnockout(body, playerDetailSel);
  else if (playerDetailView === 'clasificados') renderPDQualified(body, playerDetailSel);
  else if (playerDetailView === 'honor')        renderPDHonor(body, playerDetailSel);
  else                                          renderPDMatches(body, playerDetailSel);
}

// Extrae {sign, score} de un pronóstico, sea de grupos ("1|2-0") o KO ("Cruce·1|2-0").
function predSignScore(pred) {
  if (pred == null) return null;
  if (String(pred).indexOf('·') >= 0) {
    const p = parseKoPred(pred);
    return p ? { sign: p.sign, score: p.score } : null;
  }
  const parts = String(pred).split('|');
  return parts.length > 1 ? { sign: parts[0], score: parts.slice(1).join('|') } : { sign: '', score: parts[0] };
}

// ── Vista 1: Fase de Grupos (solo partidos de grupos; los cruces KO viven en la
// vista "Fase KO", que los premia sin importar la llave, igual que el Excel) ────
function renderPDMatches(el, player) {
  const store = PLAYER_MATCH_DATA[player] || {};

  // Partidos de grupos ya jugados.
  const played = FIXTURE_ALL.filter(m =>
    m.phase === 'grupos' &&
    m.goal_home !== null && m.goal_away !== null)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0));

  let total = 0, conPuntos = 0, exactos = 0;
  played.forEach(m => {
    const d = store[m.home + '-' + m.away];
    const pts = d ? d.pts : 0;
    total += pts;
    if (pts > 0) conPuntos++;
    const ss = d && d.pred ? predSignScore(d.pred) : null;
    if (ss && ss.score === `${m.goal_home}-${m.goal_away}`) exactos++;
  });

  const clasInfo = CLAS_BY_NAME[player] || {};

  const summary = document.createElement('div');
  summary.className = 'pd-summary';
  summary.innerHTML = `
    <div class="pd-stat"><div class="pd-stat-val green">${total}</div><div class="pd-stat-lbl">Puntos fase de grupos</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${clasInfo.pos ? '#' + clasInfo.pos : '—'}</div><div class="pd-stat-lbl">Posición general</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${played.length}</div><div class="pd-stat-lbl">Partidos jugados</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${conPuntos}</div><div class="pd-stat-lbl">Con puntos</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${exactos}</div><div class="pd-stat-lbl">Marcador exacto</div></div>`;
  el.appendChild(summary);

  // Tabla de partidos jugados
  if (played.length) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const t = document.createElement('table');
    t.className = 'fixture-table pd-table';
    t.innerHTML = `<thead><tr>
      <th>Fecha (UTC-4)</th><th class="left">Partido</th>
      <th>Resultado Real</th><th>Tu Pronóstico</th><th>Puntos</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    played.forEach(m => {
      const d = store[m.home + '-' + m.away];
      const pts = d ? d.pts : 0;
      const realScore = `${m.goal_home}-${m.goal_away}`;
      const realSign = signFromGoals(m.goal_home, m.goal_away);
      const ss = d && d.pred ? predSignScore(d.pred) : null;
      const predHtml = ss
        ? `<span class="score-pred">${ss.sign ? signBadge(ss.sign) : ''}${h(ss.score)}</span>`
        : `<span class="pred-null">Sin pronóstico</span>`;
      const tr = document.createElement('tr');
      if (pts > 0) tr.classList.add('hit');
      tr.innerHTML = `
        <td style="white-space:nowrap;font-size:.75rem">${fmtDate(m.date)}</td>
        <td class="team left">${h(m.home)} <span style="color:var(--muted);font-weight:400">vs</span> ${h(m.away)}</td>
        <td class="score"><span class="score-real">${signBadge(realSign)}${realScore}</span></td>
        <td class="score">${predHtml}</td>
        <td class="pd-pts ${pts > 0 ? 'pos' : 'zero'}">${pts}</td>`;
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    const tfoot = document.createElement('tfoot');
    tfoot.innerHTML = `<tr><td colspan="4" class="left">TOTAL fase de grupos</td><td class="pd-total-val">${total}</td></tr>`;
    t.appendChild(tfoot);
    wrap.appendChild(t);
    el.appendChild(wrap);
  } else {
    el.insertAdjacentHTML('beforeend', emptyState('Aún no hay partidos con resultado cargado.', '🗓️'));
  }
}

// ── Vista 1b: Fase KO (cruces pronosticados por ronda; puntos del Excel, que
// cuentan si el cruce ocurre en la ronda sin importar la posición de la llave) ──
const KO_ROUND_PHASES = [
  [/Dieciseisavos/i, ['dieciseisavos']],
  [/Octavos/i,       ['octavos']],
  [/Cuartos/i,       ['cuartos']],
  [/Semifinal/i,     ['semis']],
  [/3-4|Final/i,     ['tercero', 'final']],
];
function phasesForRound(label) {
  for (const [re, phases] of KO_ROUND_PHASES) if (re.test(String(label))) return phases;
  return null;
}

function renderPDKnockout(el, player) {
  const rounds = PLAYER_KO_DATA[player] || [];
  if (!rounds.length) {
    el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronósticos de fases eliminatorias.', '⚔️'));
    return;
  }

  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Tus cruces pronosticados en cada ronda, el cruce real y los puntos que sumaste.
     Tu cruce cuenta <strong>si ese enfrentamiento ocurre en la ronda, sin importar la posición de la llave</strong>
     (igual que el Excel), y puntúa según el resultado: <strong>marcador exacto = 9, signo acertado = 3</strong>,
     resultado errado = 0. "No se dio": el cruce no ocurrió; "Por definirse": la ronda aún no tiene todos sus cruces.</div>`);

  // Primera pasada: resolver cada fila contra el fixture y acumular métricas.
  let grand = 0, aciertos = 0, pendientes = 0;
  const sections = rounds.map(round => {
    const phases = phasesForRound(round.label);
    const inRound = m => m.phase !== 'grupos' && (!phases || phases.includes(m.phase));
    const realByCruce = {};
    FIXTURE_ALL.filter(m => inRound(m) && !isPlaceholderTeam(m.home) && !isPlaceholderTeam(m.away))
      .forEach(m => { realByCruce[cruceKey(m.home, m.away)] = m; });
    // ¿Todos los cruces de la ronda ya están definidos en el fixture?
    const defined = FIXTURE_ALL.filter(inRound)
      .every(m => !isPlaceholderTeam(m.home) && !isPlaceholderTeam(m.away));

    let subtotal = 0;
    const rows = round.rows.map(r => {
      const p = parseKoPred(r.pred);
      const real = (p && p.home && p.away) ? realByCruce[cruceKey(p.home, p.away)] : undefined;
      subtotal += r.pts;
      if (real) aciertos++;
      if (real && real.goal_home === null) pendientes++;
      return { ...r, parsed: p, real, defined };
    });
    grand += subtotal;
    return { label: round.label, rows, subtotal };
  });

  const summary = document.createElement('div');
  summary.className = 'pd-summary';
  summary.innerHTML = `
    <div class="pd-stat"><div class="pd-stat-val green">${grand}</div><div class="pd-stat-lbl">Puntos fase KO</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${aciertos}</div><div class="pd-stat-lbl">Cruces acertados</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${pendientes}</div><div class="pd-stat-lbl">Por jugarse</div></div>`;
  el.appendChild(summary);

  sections.forEach(sec => {
    el.insertAdjacentHTML('beforeend',
      `<div class="ko-section">${h(sec.label)} · <span style="color:var(--gold)">${sec.subtotal} pts</span></div>`);
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const t = document.createElement('table');
    t.className = 'fixture-table pd-table';
    t.innerHTML = `<thead><tr>
      <th class="left">Tu Cruce</th><th>Tu Pronóstico</th>
      <th>Cruce Real</th><th>Puntos</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    sec.rows.forEach(r => {
      const p = r.parsed;
      const cruceHtml = p && p.away
        ? `${h(p.home)} <span style="color:var(--muted);font-weight:400">vs</span> ${h(p.away)}`
        : h(r.pred);
      const predHtml = p
        ? `<span class="score-pred">${p.sign ? signBadge(p.sign) : ''}${h(p.score)}</span>`
        : `<span class="pred-null">—</span>`;
      let realHtml;
      if (r.real && r.real.goal_home !== null) {
        // Mostrar el resultado real en LA MISMA orientación del cruce del jugador:
        // si puso "Japón-Brasil" y el partido fue "Brasil-Japón" 2-1, aquí se ve 1-2.
        const flip = p && p.home === r.real.away;
        const gh = flip ? r.real.goal_away : r.real.goal_home;
        const ga = flip ? r.real.goal_home : r.real.goal_away;
        const sign = signFromGoals(gh, ga);
        realHtml = `<span class="score-real">${signBadge(sign)}${gh}-${ga}</span>` +
                   penNote(flip ? r.real.pen_away : r.real.pen_home,
                           flip ? r.real.pen_home : r.real.pen_away);
      } else if (r.real) {
        realHtml = `<span style="color:var(--gold);font-size:.78rem">⏳ Pendiente</span>`;
      } else if (r.defined) {
        realHtml = `<span class="pred-null">No se dio</span>`;
      } else {
        realHtml = `<span class="pred-null">Por definirse</span>`;
      }
      const tr = document.createElement('tr');
      if (r.pts > 0) tr.classList.add('hit');
      tr.innerHTML = `
        <td class="team left">${cruceHtml}</td>
        <td class="score">${predHtml}</td>
        <td class="score">${realHtml}</td>
        <td class="pd-pts ${r.pts > 0 ? 'pos' : 'zero'}">${r.pts}</td>`;
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    el.appendChild(wrap);
  });

  el.insertAdjacentHTML('beforeend',
    `<div class="table-wrap"><table class="fixture-table pd-table"><tfoot>
       <tr><td class="left">TOTAL fase KO</td><td class="pd-total-val" style="width:90px">${grand}</td></tr>
     </tfoot></table></div>`);
}

// ── Vista 2: Posición Grupos (pronóstico vs real, por grupo) ────────────────────
function renderPDPositions(el, player) {
  const byGrp = PLAYER_POS_DATA[player] || {};
  const groups = Object.keys(byGrp).sort();
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Posición que pronosticaste en cada grupo vs. la posición real del fixture. Verde = acertaste esa posición.</div>`);
  if (!groups.length) { el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronóstico de posiciones de grupo.', '📊')); return; }

  let totalPts = 0;
  groups.forEach(g => (byGrp[g] || []).forEach(p => totalPts += (p.pts || 0)));
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-summary"><div class="pd-stat"><div class="pd-stat-val green">${totalPts}</div><div class="pd-stat-lbl">Puntos posición grupos</div></div></div>`);

  const grid = document.createElement('div');
  grid.className = 'pd-grid';
  groups.forEach(g => {
    const preds = (byGrp[g] || []).slice().sort((a, b) => a.pos - b.pos);
    const real = GROUPS_BY_NAME['Grupo ' + g] || [];
    const sub = preds.reduce((s, p) => s + (p.pts || 0), 0);
    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">Grupo ${h(g)}</div>
      <div class="pred-card-sub">${sub} pts</div>
      <table class="pos-table"><thead><tr><th>#</th><th>Tu pronóstico</th><th>Real</th><th></th></tr></thead><tbody>`;
    preds.forEach(p => {
      const realTeam = real[p.pos - 1] ? real[p.pos - 1].team : '—';
      const hit = (p.pts || 0) > 0;
      html += `<tr class="${hit ? 'hit' : ''}">
        <td class="pos-n">${p.pos}°</td>
        <td class="pos-pred">${h(p.predTeam || '—')}</td>
        <td class="pos-real">${h(realTeam)}</td>
        <td class="pos-pts">${p.pts || 0}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    card.innerHTML = html;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// ── Vista 3: Equipos Clasificados por ronda (el Cuadro de Honor va en su vista) ──
function renderPDQualified(el, player) {
  const bySeg = PLAYER_QUAL_DATA[player] || {};
  const segs = Object.values(bySeg).filter(s => s.key !== 'honor').sort((a, b) => a.order - b.order);
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Equipos que pronosticaste por ronda. Sumas si el equipo llega a esa ronda, sin importar la llave que pusiste. Verde = ya clasificó y sumó.</div>`);
  if (!segs.length) { el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronóstico de equipos clasificados.', '🏅')); return; }

  let grandTotal = 0;
  segs.forEach(s => s.items.forEach(it => grandTotal += (it.pts || 0)));
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-summary"><div class="pd-stat"><div class="pd-stat-val green">${grandTotal}</div><div class="pd-stat-lbl">Puntos equipos clasificados</div></div></div>`);

  const grid = document.createElement('div');
  grid.className = 'pd-grid';
  segs.forEach(s => {
    const sub = s.items.reduce((a, it) => a + (it.pts || 0), 0);
    const hits = s.items.filter(it => (it.pts || 0) > 0).length;
    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">${h(s.name)}</div>
      <div class="pred-card-sub">${hits}/${s.items.length} aciertos · ${sub} pts</div>`;
    // Final y 3er/4to puesto -> filas rol→equipo (rótulos heterogéneos).
    // Rondas de avance (1/16…semis) -> chips de equipos.
    const ROLE_SEGS = { rfinal: 1, r34: 1 };
    if (ROLE_SEGS[s.key]) {
      s.items.forEach(it => {
        const hit = (it.pts || 0) > 0;
        html += `<div class="qual-role ${hit ? 'hit' : ''}">
          <span class="qr-lbl">${h(honorLabel(it.label))}</span>
          <span class="qr-team">${h(it.predTeam || '—')}</span>
          <span class="qr-pts">${it.pts || 0}</span>
        </div>`;
      });
    } else {
      html += `<div class="qual-grid">` + s.items.map(it => {
        const hit = (it.pts || 0) > 0;
        return `<span class="qual-chip ${hit ? 'hit' : 'miss'}">${h(it.predTeam || '—')}${hit ? `<span class="qp">+${it.pts}</span>` : ''}</span>`;
      }).join('') + `</div>`;
    }
    card.innerHTML = html;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// ── Vista 4: Cuadro de Honor (podio + botas + balones) ──────────────────────────
function renderPDHonor(el, player) {
  const seg = (PLAYER_QUAL_DATA[player] || {}).honor;
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Podio final y premios individuales. Verde = acertado. Los puntos se cargan cuando se define cada premio.</div>`);
  if (!seg || !seg.items.length) { el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronóstico de Cuadro de Honor.', '🏆')); return; }

  const total = seg.items.reduce((a, it) => a + (it.pts || 0), 0);
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-summary"><div class="pd-stat"><div class="pd-stat-val green">${total}</div><div class="pd-stat-lbl">Puntos Cuadro de Honor</div></div></div>`);

  // Agrupa en Podio / Bota de Oro / Balón de Oro (como las cards de Posición Grupos)
  const buckets = [
    { name: '🏆 Podio final',  test: it => !/Bota|Bal[oó]n/i.test(it.label), items: [] },
    { name: '👟 Bota de Oro',  test: it => /Bota/i.test(it.label),          items: [] },
    { name: '⚽ Balón de Oro', test: it => /Bal[oó]n/i.test(it.label),       items: [] },
  ];

  const grid = document.createElement('div');
  grid.className = 'pd-grid';
  buckets.forEach(b => {
    if (!b.items.length) return;
    const sub = b.items.reduce((a, it) => a + (it.pts || 0), 0);
    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">${h(b.name)}</div><div class="pred-card-sub">${sub} pts</div>`;
    b.items.forEach(it => {
      const hit = (it.pts || 0) > 0;
      html += `<div class="qual-role ${hit ? 'hit' : ''}">
        <span class="qr-lbl">${h(honorLabel(it.label))}</span>
        <span class="qr-team">${h(it.predTeam || '—')}</span>
        <span class="qr-pts">${it.pts || 0}</span>
      </div>`;
    });
    card.innerHTML = html;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// Limpia el rótulo de una columna del Cuadro de Honor (quita emojis y sufijos "-N").
function honorLabel(label) {
  return String(label)
    .replace(/^[^0-9A-Za-zÁÉÍÓÚÑáéíóúñ]+/, '')
    .replace(/-\d+$/, '')
    .trim();
}

// ── RECTA FINAL: proyección de escenarios sobre los partidos KO pendientes ────
// Enumera todas las combinaciones de ganadores de los partidos pendientes del
// fixture (con Suiza-Colombia + cuartos + semis + 3º + final son 2^9 = 512) y
// calcula por jugador: piso (solo equipos clasificados + cuadro de honor de
// equipos), proyección con aciertos de signo, techo (todo exacto) y si sigue
// vivo matemáticamente. Se recalcula solo con cada actualización de data.json:
// al jugarse un partido deja de ser pendiente y los escenarios se reducen.
//
// Reglas (validadas contra el Excel y contra los pagos reales de 16avos/8vos):
//   cruce: vale si el par ocurre en la ronda (sin importar llave ni orden);
//   empate+penales => signo X (predecir al que avanza con 1/2 da 0);
//   botas y balones NO se proyectan (premios individuales, no de resultados).
const ESC_SIGN  = { dieciseisavos: 3, octavos: 4, cuartos: 5, semis: 6, tercero: 6, final: 7 };
const ESC_EXACT = { dieciseisavos: 9, octavos: 12, cuartos: 15, semis: 18, tercero: 18, final: 21 };
// Los PARTICIPANTES de un partido de fase X son "clasificados a X":
const ESC_SEG_OF_PHASE = { dieciseisavos: 'r32', octavos: 'r16', cuartos: 'r8', semis: 'r4', tercero: 'r34', final: 'rfinal' };
const ESC_EQ_PTS = { r32: 3, r16: 4, r8: 5, r4: 7, r34: 5, rfinal: 10 };
const ESC_HONOR = { camp: 20, sub: 10, ter: 5 };
const ESC_SEG_LABEL = { r8: 'Cuartofinalistas pendientes', r4: 'Semifinalistas', r34: 'Juegan el 3er puesto', rfinal: 'Finalistas' };
// Premios individuales (hipótesis): por defecto no se proyectan; el usuario
// puede elegir ganadores de botas/balones y se recalcula todo incluyéndolos.
const ESC_AWARD_DEFS = [
  { k: 'bota_oro',     icon: '👟🥇', label: 'Bota de Oro',     pts: 10, re: /^Bota de Oro/i },
  { k: 'bota_plata',   icon: '👟🥈', label: 'Bota de Plata',   pts: 5,  re: /^Bota de Plata/i },
  { k: 'bota_bronce',  icon: '👟🥉', label: 'Bota de Bronce',  pts: 3,  re: /^Bota de Bronce/i },
  { k: 'balon_oro',    icon: '🏅🥇', label: 'Balón de Oro',    pts: 10, re: /^Bal[oó]n de Oro/i },
  { k: 'balon_plata',  icon: '🏅🥈', label: 'Balón de Plata',  pts: 5,  re: /^Bal[oó]n de Plata/i },
  { k: 'balon_bronce', icon: '🏅🥉', label: 'Balón de Bronce', pts: 3,  re: /^Bal[oó]n de Bronce/i },
];
const ESC_AWARD_SEL = { bota_oro: '', bota_plata: '', bota_bronce: '', balon_oro: '', balon_plata: '', balon_bronce: '' };
let ESC_STATE = null;

function ensureEscenarios() {
  const el = document.getElementById('escenarios-content');
  if (!el || ESC_STATE) return;
  if (!FIXTURE_ALL.length) { el.innerHTML = emptyState('Cargando datos…', '⏳'); return; }
  el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)"><div class="spinner"></div>Calculando escenarios…</div>';
  setTimeout(() => {
    try { ESC_STATE = escCompute(); renderEscenarios(); }
    catch (e) { el.innerHTML = emptyState('No se pudo calcular la proyección: ' + e.message, '⚠️'); }
  }, 30);
}

// Ganador de un partido ya jugado (empate => define el ganador por penales).
function escWinnerOf(m) {
  if (m.goal_home == null || m.goal_away == null) return null;
  if (m.goal_home !== m.goal_away) return m.goal_home > m.goal_away ? m.home : m.away;
  if (m.pen_home != null && m.pen_away != null && m.pen_home !== m.pen_away)
    return m.pen_home > m.pen_away ? m.home : m.away;
  return null;
}

function escCompute() {
  const norm = s => (s == null ? '' : String(s).trim());
  const byNum = {};
  FIXTURE_ALL.forEach(m => { if (m.num != null) byNum[m.num] = m; });
  const pending = FIXTURE_ALL
    .filter(m => m.phase !== 'grupos' && (m.goal_home == null || m.goal_away == null))
    .sort((a, b) => (a.num || 0) - (b.num || 0));
  if (!pending.length) return { done: true };
  if (pending.length > 12) throw new Error('hay demasiados partidos pendientes para enumerar escenarios');

  // 'W97' / 'L101' -> equipo real, usando resultados jugados o el escenario en curso
  function resolveTeam(t, parts, winners) {
    const mm = /^([WL])(\d+)$/.exec(norm(t));
    if (!mm) return norm(t);
    const ref = +mm[2], isW = mm[1] === 'W';
    if (winners[ref] != null) {
      const w = winners[ref], pr = parts[ref];
      return isW ? w : (pr[0] === w ? pr[1] : pr[0]);
    }
    const m = byNum[ref];
    if (m) {
      const w = escWinnerOf(m);
      if (w) return isW ? w : (w === m.home ? m.away : m.home);
    }
    return null;
  }

  // ── Enumeración de escenarios (ganador de cada partido pendiente) ──
  const scenarios = [];
  (function rec(i, parts, winners) {
    if (i === pending.length) {
      scenarios.push({ parts: Object.assign({}, parts), winners: Object.assign({}, winners) });
      return;
    }
    const m = pending[i];
    const A = resolveTeam(m.home, parts, winners);
    const B = resolveTeam(m.away, parts, winners);
    if (!A || !B) throw new Error('no se pudo definir ' + m.home + '-' + m.away +
      ' — probablemente falta cargar los penales de un empate; la vista se corregirá sola al completarse el resultado');
    parts[m.num] = [A, B];
    [A, B].forEach(w => { winners[m.num] = w; rec(i + 1, parts, winners); });
    delete winners[m.num]; delete parts[m.num];
  })(0, {}, {});
  const N = scenarios.length;

  // ── Datos por jugador: picks sin pagar, honor y pool de cruces por fase ──
  // Un premio con algún pick ya pagado (pts>0) está RESUELTO: sale del
  // selector de hipótesis y no reparte bono (los picks perdedores quedan
  // con pts=0 pero ya no pueden cobrar).
  const paidAwards = {};
  const prep = ALL_PLAYERS.map(name => {
    const clas = CLAS_BY_NAME[name] || {};
    const qd = PLAYER_QUAL_DATA[name] || {};
    const qual = {};
    Object.keys(ESC_EQ_PTS).forEach(seg => {
      qual[seg] = (((qd[seg] || {}).items) || [])
        .filter(it => (it.pts || 0) === 0 && it.predTeam)
        .map(it => norm(it.predTeam));
    });
    const honor = { camp: null, sub: null, ter: null };
    const awards = {};
    ((((qd.honor || {}).items) || [])).forEach(it => {
      const lbl = String(it.label).replace(/\s+/g, ' ').trim();
      const def = ESC_AWARD_DEFS.find(d => d.re.test(lbl));
      if (def && (it.pts || 0) > 0) paidAwards[def.k] = true;
      if ((it.pts || 0) > 0 || !it.predTeam) return;
      if (def) { awards[def.k] = norm(it.predTeam); return; } // botas/balones
      if (/Subcampe/i.test(lbl)) honor.sub = norm(it.predTeam);
      else if (/Campe/i.test(lbl)) honor.camp = norm(it.predTeam);
      else if (/puesto/i.test(lbl)) honor.ter = norm(it.predTeam);
    });
    const cruces = {};
    Object.keys(KO_PRED_BY_PHASE).forEach(ph => {
      (KO_PRED_BY_PHASE[ph] || []).forEach(it => {
        if (norm(it.jugador) !== name || !it.parsed || !it.parsed.away) return;
        const sc = /^(\d+)-(\d+)$/.exec(norm(it.parsed.score));
        (cruces[ph] = cruces[ph] || []).push({
          key: cruceKey(it.parsed.home, it.parsed.away),
          home: norm(it.parsed.home), away: norm(it.parsed.away),
          sign: norm(it.parsed.sign),
          gh: sc ? +sc[1] : null, ga: sc ? +sc[2] : null,
          raw: it.parsed.home + '-' + it.parsed.away + ' · ' + it.parsed.sign + ' | ' + it.parsed.score,
        });
      });
    });
    return { name, current: clas.puntos || 0, base: clas.puntos || 0,
             bonus: 0, pos: clas.pos || 0, qual, honor, awards, cruces };
  });
  // Bono fijo de la hipótesis activa (segunda pasada: paidAwards ya completo;
  // un premio resuelto nunca reparte bono).
  prep.forEach(p => {
    let bonus = 0;
    ESC_AWARD_DEFS.forEach(d => {
      if (!paidAwards[d.k] && ESC_AWARD_SEL[d.k] && p.awards[d.k] === ESC_AWARD_SEL[d.k]) bonus += d.pts;
    });
    p.bonus = bonus;
    p.current = p.base + bonus;
  });
  const P = prep.length;

  // ── Evaluación por (jugador, escenario) ──
  const finalM = pending.find(m => m.phase === 'final') || null;
  const tercM  = pending.find(m => m.phase === 'tercero') || null;
  function findCruce(p, phase, key) {
    const list = p.cruces[phase];
    if (!list) return null;
    for (const c of list) if (c.key === key) return c;
    return null;
  }
  function predWinner(c) { return c.sign === '1' ? c.home : c.sign === '2' ? c.away : null; }

  const floors = [], mids = [], maxs = [];
  for (let pi = 0; pi < P; pi++) { floors.push(new Array(N)); mids.push(new Array(N)); maxs.push(new Array(N)); }
  for (let si = 0; si < N; si++) {
    const sc = scenarios[si];
    for (let pi = 0; pi < P; pi++) {
      const p = prep[pi];
      let eqh = 0, sign = 0, exact = 0;
      for (const m of pending) {
        const parts = sc.parts[m.num], w = sc.winners[m.num];
        const seg = ESC_SEG_OF_PHASE[m.phase];
        // equipos clasificados: solo cupos que venían de placeholder (los cupos
        // con equipo ya conocido en el fixture ya fueron pagados por el Excel)
        if (seg && p.qual[seg] && p.qual[seg].length) {
          if (isPlaceholderTeam(m.home) && p.qual[seg].indexOf(parts[0]) >= 0) eqh += ESC_EQ_PTS[seg];
          if (isPlaceholderTeam(m.away) && p.qual[seg].indexOf(parts[1]) >= 0) eqh += ESC_EQ_PTS[seg];
        }
        if (m.phase === 'final') {
          const loser = parts[0] === w ? parts[1] : parts[0];
          if (p.honor.camp === w) eqh += ESC_HONOR.camp;
          if (p.honor.sub === loser) eqh += ESC_HONOR.sub;
        } else if (m.phase === 'tercero') {
          if (p.honor.ter === w) eqh += ESC_HONOR.ter;
        }
        const c = findCruce(p, m.phase, cruceKey(parts[0], parts[1]));
        if (c) {
          const pw = predWinner(c);
          // El exacto solo es alcanzable si el marcador predicho existe y es
          // coherente con el signo (un X con marcador no empatado nunca paga exacto).
          if (pw === w) {
            sign += ESC_SIGN[m.phase];
            exact += (c.gh != null ? ESC_EXACT : ESC_SIGN)[m.phase];
          } else if (pw === null) {
            exact += (c.gh != null && c.gh === c.ga ? ESC_EXACT : ESC_SIGN)[m.phase]; // X: empate+penales
          }
        }
      }
      floors[pi][si] = p.current + eqh;
      mids[pi][si]   = p.current + eqh + sign;
      maxs[pi][si]   = p.current + eqh + exact;
    }
  }

  // ── Líderes por escenario (nivel signo) ──
  const leadShared = new Array(P).fill(0), leadStrict = new Array(P).fill(0);
  const leadersByScenario = [];
  for (let si = 0; si < N; si++) {
    let best = -Infinity;
    for (let pi = 0; pi < P; pi++) if (mids[pi][si] > best) best = mids[pi][si];
    const leaders = [];
    for (let pi = 0; pi < P; pi++) if (mids[pi][si] === best) leaders.push(pi);
    leadersByScenario.push(leaders);
    leaders.forEach(pi => leadShared[pi]++);
    if (leaders.length === 1) leadStrict[leaders[0]]++;
  }

  // ── Vivo/eliminado: test de factibilidad con marcadores consistentes ──
  // El candidato fija sus cruces consistentes en exacto (eso puede FORZAR
  // puntos a rivales con el mismo cruce); en los partidos libres se prueba,
  // por partido, marcador raro sin empate vs empate raro con penales.
  function escFeasible(pi, si) {
    const p = prep[pi], sc = scenarios[si];
    const fixed = [], free = [];
    let tx = floors[pi][si];
    pending.forEach(m => {
      const parts = sc.parts[m.num], w = sc.winners[m.num];
      const key = cruceKey(parts[0], parts[1]);
      const c = findCruce(p, m.phase, key);
      const pw = c ? predWinner(c) : undefined;
      // Solo se fija el marcador si el exacto es alcanzable (marcador presente y
      // coherente con el signo); si no, el partido queda libre (conservador).
      const exactable = c && (pw === w ? c.gh != null
        : (pw === null && c.gh != null && c.gh === c.ga));
      if (exactable) {
        tx += ESC_EXACT[m.phase];
        fixed.push({ m, key, w, draw: pw === null, s: c.gh,
                     wg: pw === c.home ? c.gh : c.ga, lg: pw === c.home ? c.ga : c.gh });
      } else free.push({ m, key, w });
    });
    const base = new Array(P).fill(0);
    for (let y = 0; y < P; y++) {
      if (y === pi) continue;
      let b = floors[y][si];
      for (const f of fixed) {
        const cy = findCruce(prep[y], f.m.phase, f.key);
        if (!cy) continue;
        const pwy = predWinner(cy);
        if (f.draw) {
          if (pwy === null) b += (cy.gh != null && cy.gh === cy.ga && cy.gh === f.s)
            ? ESC_EXACT[f.m.phase] : ESC_SIGN[f.m.phase];
        } else if (pwy === f.w) {
          const wg = pwy === cy.home ? cy.gh : cy.ga, lg = pwy === cy.home ? cy.ga : cy.gh;
          b += (wg === f.wg && lg === f.lg) ? ESC_EXACT[f.m.phase] : ESC_SIGN[f.m.phase];
        }
      }
      base[y] = b;
    }
    const opts = [];
    for (const fr of free) {
      const ca = {}, cb = {};
      let any = false;
      for (let y = 0; y < P; y++) {
        if (y === pi) continue;
        const cy = findCruce(prep[y], fr.m.phase, fr.key);
        if (!cy) continue;
        const pwy = predWinner(cy);
        const av = pwy === fr.w ? ESC_SIGN[fr.m.phase] : 0;
        const bv = pwy === null ? ESC_SIGN[fr.m.phase] : 0;
        if (av || bv) { ca[y] = av; cb[y] = bv; any = true; }
      }
      if (any) opts.push([ca, cb]);
    }
    if (opts.length > 12) return true; // salvaguarda (no debería ocurrir)
    for (let mask = 0; mask < (1 << opts.length); mask++) {
      let ok = true;
      for (let y = 0; y < P && ok; y++) {
        if (y === pi) continue;
        let t = base[y];
        for (let k = 0; k < opts.length; k++) {
          const src = ((mask >> k) & 1) ? opts[k][1] : opts[k][0];
          if (src[y]) t += src[y];
        }
        if (t > tx) ok = false;
      }
      if (ok) return true;
    }
    return false;
  }

  const alive = new Array(P).fill(false);
  const example = new Array(P).fill(null);
  for (let pi = 0; pi < P; pi++) {
    for (let si = 0; si < N; si++) {
      let rivalFloor = -Infinity;
      for (let y = 0; y < P; y++) if (y !== pi && floors[y][si] > rivalFloor) rivalFloor = floors[y][si];
      if (maxs[pi][si] < rivalFloor) continue;         // ni en el mejor caso alcanza
      if (escFeasible(pi, si)) { alive[pi] = true; example[pi] = scenarios[si]; break; }
    }
  }

  // ── Qué sigue posible (para marcar picks/cruces vivos) ──
  const possibleBySeg = {}, possiblePairs = {};
  let campSet = {}, subSet = {}, terSet = {};
  scenarios.forEach(sc => {
    pending.forEach(m => {
      const parts = sc.parts[m.num], w = sc.winners[m.num];
      const seg = ESC_SEG_OF_PHASE[m.phase];
      if (seg) {
        const set = possibleBySeg[seg] = possibleBySeg[seg] || {};
        if (isPlaceholderTeam(m.home)) set[parts[0]] = true;
        if (isPlaceholderTeam(m.away)) set[parts[1]] = true;
      }
      (possiblePairs[m.phase] = possiblePairs[m.phase] || {})[cruceKey(parts[0], parts[1])] = true;
      if (m.phase === 'final') { campSet[w] = true; subSet[parts[0] === w ? parts[1] : parts[0]] = true; }
      if (m.phase === 'tercero') terSet[w] = true;
    });
  });

  // ── Condiciones de los escenarios donde lidera ──
  const conds = new Array(P).fill(null);
  for (let pi = 0; pi < P; pi++) {
    const idxs = [];
    for (let si = 0; si < N; si++) if (leadersByScenario[si].indexOf(pi) >= 0) idxs.push(si);
    if (!idxs.length) continue;
    const fixedW = [];
    pending.forEach(m => {
      const vals = {};
      idxs.forEach(si => { vals[scenarios[si].winners[m.num]] = true; });
      const keys = Object.keys(vals);
      if (keys.length === 1) fixedW.push({ m, team: keys[0] });
    });
    const champDist = {};
    if (finalM) idxs.forEach(si => {
      const c = scenarios[si].winners[finalM.num];
      champDist[c] = (champDist[c] || 0) + 1;
    });
    conds[pi] = { n: idxs.length, fixedW, champDist };
  }

  // ── Tabla "si el campeón es…" ──
  let champTable = null;
  if (finalM) {
    champTable = {};
    for (let si = 0; si < N; si++) {
      const c = scenarios[si].winners[finalM.num];
      const t = champTable[c] = champTable[c] || { total: 0, leaders: {} };
      t.total++;
      leadersByScenario[si].forEach(pi => { t.leaders[prep[pi].name] = (t.leaders[prep[pi].name] || 0) + 1; });
    }
  }

  const players = prep.map((p, pi) => ({
    name: p.name, current: p.base, bonus: p.bonus, pos: p.pos,
    piso: Math.min.apply(null, floors[pi]),
    techo: Math.max.apply(null, maxs[pi]),
    leadShared: leadShared[pi], leadStrict: leadStrict[pi],
    vivo: alive[pi], example: example[pi], cond: conds[pi],
    qual: p.qual, honor: p.honor, awards: p.awards,
    crucesVivos: Object.keys(p.cruces).reduce((acc, ph) => {
      const alivePairs = possiblePairs[ph] || {};
      const seen = {};
      acc[ph] = p.cruces[ph].filter(c => alivePairs[c.key] && !seen[c.key] && (seen[c.key] = true));
      return acc;
    }, {}),
  })).sort((a, b) => (b.current + b.bonus) - (a.current + a.bonus) ||
                     a.name.localeCompare(b.name, 'es'));

  const phaseLabel = {};
  pending.forEach(m => { phaseLabel[m.phase] = m.phase_label || m.phase; });

  // Opciones del selector de premios: nombres elegidos por algún jugador para
  // ese premio (un ganador que nadie eligió equivale a "ninguno").
  const awardOptions = {};
  ESC_AWARD_DEFS.forEach(d => {
    if (paidAwards[d.k]) { awardOptions[d.k] = []; return; }  // premio ya resuelto
    const set = {};
    prep.forEach(p => { if (p.awards[d.k]) set[p.awards[d.k]] = true; });
    awardOptions[d.k] = Object.keys(set).sort((a, b) => a.localeCompare(b, 'es'));
  });

  return {
    done: false, N, pending, players, champTable,
    possibleBySeg, campSet, subSet, terSet, phaseLabel, awardOptions,
  };
}

function escPhaseName(m) { return m.phase_label || m.phase; }

function renderEscenarios() {
  const el = document.getElementById('escenarios-content');
  const S = ESC_STATE;
  if (!S) return;
  if (S.done) {
    el.innerHTML = emptyState('El mundial ya terminó: no quedan partidos por jugar. La clasificación es definitiva.', '🏆');
    return;
  }
  const vivos = S.players.filter(p => p.vivo);
  const elims = S.players.filter(p => !p.vivo);
  const maxLead = Math.max.apply(null, S.players.map(p => p.leadShared).concat([1]));

  let html = '<div class="esc-wrap">';
  html += `<div class="esc-note">Con <strong>${S.pending.length} partido(s) pendiente(s)</strong> hay
    <strong>${S.N} escenarios</strong> posibles de ganadores. Esta vista recorre todos y proyecta, por jugador,
    su <strong>techo</strong> (acierta todo lo que le queda con marcador exacto), en cuántos escenarios queda de
    <strong>líder</strong> (acertando solo el signo) y si sigue <strong>vivo matemáticamente</strong>.
    Se actualiza sola con cada resultado. Del cuadro de honor se cuentan Campeón (20), Subcampeón (10)
    y 3er puesto (5); botas y balones solo si activas una hipótesis abajo.</div>`;

  html += '<div class="esc-tiles">'
    + `<div class="esc-tile"><div class="v">${S.pending.length}</div><div class="l">Por jugar</div></div>`
    + `<div class="esc-tile"><div class="v">${S.N}</div><div class="l">Escenarios</div></div>`
    + `<div class="esc-tile"><div class="v">${vivos.length}</div><div class="l">Siguen vivos</div></div>`
    + `<div class="esc-tile"><div class="v">${elims.length}</div><div class="l">Eliminados</div></div>`
    + '</div>';

  // Selector de hipótesis de premios individuales (botas y balones)
  const anyAwardOpts = ESC_AWARD_DEFS.some(d => (S.awardOptions[d.k] || []).length);
  const hipActiva = ESC_AWARD_DEFS.some(d => ESC_AWARD_SEL[d.k] && (S.awardOptions[d.k] || []).length);
  if (anyAwardOpts) {
    html += '<div class="esc-h2">🏅 Premios individuales (hipótesis)</div>'
      + '<div class="esc-hint">Botas y balones no se proyectan por defecto. Elige aquí ganadores '
      + 'hipotéticos y toda la proyección (puntos, techo, líderes, vivos/eliminados) se recalcula '
      + 'incluyéndolos: Oro +10, Plata +5, Bronce +3 a quien lo haya pronosticado. '
      + 'Las opciones son los nombres que los jugadores eligieron para cada premio.</div>'
      + '<div class="esc-awards">';
    const hAttr = s => h(s).replace(/"/g, '&quot;');
    ESC_AWARD_DEFS.forEach(d => {
      const opts = S.awardOptions[d.k] || [];
      if (!opts.length) return;
      html += `<label class="esc-award"><span>${d.icon} ${h(d.label)} <small>+${d.pts}</small></span>`
        + `<select class="esc-award-sel" data-k="${d.k}"><option value="">— ninguno / otro</option>`
        + opts.map(o => `<option value="${hAttr(o)}"${ESC_AWARD_SEL[d.k] === o ? ' selected' : ''}>${h(o)}</option>`).join('')
        + '</select></label>';
    });
    html += hipActiva
      ? '<button id="esc-award-reset" class="esc-award-btn">✕ Quitar hipótesis</button>'
      : '';
    html += '</div>';
  }

  if (elims.length) {
    html += '<div class="esc-h2">❌ Ya no pueden ganar la quiniela'
      + (hipActiva ? ' <small style="color:var(--muted)">(con la hipótesis de premios activa)</small>' : '')
      + '</div>'
      + '<div class="esc-hint">Eliminación matemática: ni acertando todo lo que les queda (con marcador exacto) '
      + 'alcanzan al rival que quedaría arriba en ese mismo escenario.</div>'
      + '<div class="esc-callout">'
      + elims.map(p => `<span class="esc-chip dead nostrike">${h(p.name)} <small>${p.current}${p.bonus ? `+${p.bonus}` : ''} pts · techo ${p.techo}</small></span>`).join('')
      + '</div>';
  }

  html += '<div class="esc-h2">Tabla con proyecciones</div>'
    + '<div class="esc-hint">«Lidera» cuenta escenarios donde termina de primero o empatado en la cima, '
    + 'acertando solo signos (sin bonos de exacto y asumiendo que ningún partido termina en empate; '
    + 'un empate real paga el signo X): mide cobertura de escenarios, no probabilidad.</div>'
    + '<div class="table-wrap"><table><thead><tr class="colrow">'
    + '<th>#</th><th class="left">Jugador</th><th>Puntos</th><th>Techo</th>'
    + `<th>Lidera (de ${S.N})</th><th>Estado</th></tr></thead><tbody>`;
  S.players.forEach((p, idx) => {
    const w = Math.round(1000 * p.leadShared / maxLead) / 10;
    // Con hipótesis activa el orden es por puntos+bono: se renumera para que
    // la columna # no se vea "desordenada" respecto de la posición real.
    const shownPos = hipActiva ? idx + 1 : p.pos;
    html += `<tr><td>${shownPos}</td><td class="left player-name">${h(p.name)}</td>`
      + `<td><strong>${p.current}</strong>${p.bonus ? ` <small class="esc-bonus">+${p.bonus}</small>` : ''}</td><td>${p.techo}</td>`
      + `<td class="left"><div class="esc-bar"><div class="esc-bar-fill" style="width:${w}%"></div>`
      + `<span class="esc-bar-num${w > 55 ? ' onfill' : ''}">${p.leadShared}</span></div></td>`
      + `<td>${p.vivo ? '<span class="esc-pill ok">VIVO</span>' : '<span class="esc-pill out">ELIMINADO</span>'}</td></tr>`;
  });
  html += '</tbody></table></div>';

  if (S.champTable) {
    html += '<div class="esc-h2">🏆 Si el campeón es… ¿quién gana la quiniela?</div>'
      + '<div class="esc-hint">Por cada posible campeón, quién lidera más escenarios (a nivel de signo).</div>'
      + '<div class="table-wrap"><table><thead><tr class="colrow">'
      + '<th class="left">Campeón</th><th>Escenarios</th><th class="left">Líderes más frecuentes</th></tr></thead><tbody>';
    Object.keys(S.champTable).sort((a, b) => S.champTable[b].total - S.champTable[a].total || a.localeCompare(b, 'es'))
      .forEach(c => {
        const t = S.champTable[c];
        const tops = Object.keys(t.leaders).sort((x, y) => t.leaders[y] - t.leaders[x]).slice(0, 3)
          .map(nm => `<span class="esc-chip">${h(nm)} <small>${t.leaders[nm]}/${t.total}</small></span>`).join(' ');
        html += `<tr><td class="left player-name">${h(c)}</td><td>${t.total}</td><td class="left">${tops || '—'}</td></tr>`;
      });
    html += '</tbody></table></div>';
  }

  html += '<div class="esc-h2">Jugador por jugador</div>'
    + '<div class="esc-hint">Toca un jugador para ver qué le queda vivo y qué necesita.</div>';
  S.players.forEach(p => { html += escPlayerCard(p, S); });

  html += '<ul class="esc-foot">'
    + '<li>El cruce pronosticado vale si ese enfrentamiento ocurre en la ronda, sin importar la posición de la llave ni el orden (así premia el Excel).</li>'
    + '<li>Empate + penales cuenta como signo X: predecir con 1/2 al equipo que avanza por penales da 0 en ese partido.</li>'
    + '<li>Los escenarios se tratan como igualmente posibles: los conteos miden cobertura, no probabilidad futbolística.</li>'
    + '<li>Botas y balones (hasta 36 pts extra) solo se cuentan si activas una hipótesis arriba: los veredictos de eliminación pueden cambiar con ellos.</li>'
    + '</ul>';
  html += '</div>';
  el.innerHTML = html;

  // Selector de premios: recalcular la proyección al cambiar una hipótesis.
  el.querySelectorAll('.esc-award-sel').forEach(sel => {
    sel.addEventListener('change', () => {
      ESC_AWARD_SEL[sel.dataset.k] = sel.value;
      escRecompute();
    });
  });
  const rst = el.querySelector('#esc-award-reset');
  if (rst) rst.addEventListener('click', () => {
    ESC_AWARD_DEFS.forEach(d => { ESC_AWARD_SEL[d.k] = ''; });
    escRecompute();
  });
}

// Recalcula la proyección con el mismo patrón spinner + try/catch de
// ensureEscenarios (el cómputo puede tardar segundos con muchos pendientes).
function escRecompute() {
  const el = document.getElementById('escenarios-content');
  if (!el) return;
  el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)"><div class="spinner"></div>Recalculando…</div>';
  setTimeout(() => {
    try { ESC_STATE = escCompute(); renderEscenarios(); }
    catch (e) { el.innerHTML = emptyState('No se pudo recalcular la proyección: ' + e.message, '⚠️'); }
  }, 30);
}

function escPlayerCard(p, S) {
  const chips = (teams, aliveSet) => teams.length
    ? teams.map(t => `<span class="esc-chip${aliveSet[t] ? '' : ' dead'}">${h(t)}</span>`).join(' ')
    : '<span style="color:var(--muted)">—</span>';
  const segRows = ['r8', 'r4', 'r34', 'rfinal']
    .filter(seg => (p.qual[seg] || []).length)
    .map(seg => `<div class="esc-kv"><span>${ESC_SEG_LABEL[seg]} <small>(+${ESC_EQ_PTS[seg]} c/u)</small></span>`
      + `<span>${chips(p.qual[seg], S.possibleBySeg[seg] || {})}</span></div>`).join('');
  const honorChips = [
    p.honor.camp ? `<span class="esc-chip${S.campSet[p.honor.camp] ? '' : ' dead'}">🏆 ${h(p.honor.camp)}</span>` : '',
    p.honor.sub ? `<span class="esc-chip${S.subSet[p.honor.sub] ? '' : ' dead'}">🥈 ${h(p.honor.sub)}</span>` : '',
    p.honor.ter ? `<span class="esc-chip${S.terSet[p.honor.ter] ? '' : ' dead'}">🥉 ${h(p.honor.ter)}</span>` : '',
  ].filter(Boolean).join(' ') || '<span style="color:var(--muted)">— (ya pagado o sin pick)</span>';
  const honorRow = `<div class="esc-kv"><span>Cuadro de honor</span><span>${honorChips}</span></div>`;
  const awardChips = ESC_AWARD_DEFS.map(d => {
    const pick = p.awards[d.k];
    if (!pick) return '';
    const hit = ESC_AWARD_SEL[d.k] && ESC_AWARD_SEL[d.k] === pick;
    return `<span class="esc-chip${hit ? ' award-hit' : ''}">${d.icon} ${h(pick)}${hit ? ` <small>+${d.pts}</small>` : ''}</span>`;
  }).filter(Boolean).join(' ');
  const awardsRow = awardChips
    ? `<div class="esc-kv"><span>Botas y balones</span><span>${awardChips}</span></div>` : '';
  const crucesRows = Object.keys(p.crucesVivos)
    .filter(ph => p.crucesVivos[ph].length)
    .map(ph => `<div class="esc-kv"><span>Cruce ${h(S.phaseLabel[ph] || ph)} <small>(${ESC_SIGN[ph]}/${ESC_EXACT[ph]})</small></span>`
      + `<span>${p.crucesVivos[ph].map(c => `<span class="esc-chip">${h(c.raw)}</span>`).join(' ')}</span></div>`)
    .join('') || '<div class="esc-kv"><span>Cruces pendientes que aún pueden ocurrir</span><span style="color:var(--muted)">ninguno</span></div>';

  let need;
  if (!p.vivo) {
    need = `<div class="esc-need out">Eliminado: incluso acertando todo lo que le queda (techo ${p.techo}), siempre hay un rival por encima.</div>`;
  } else if (p.cond) {
    const fixed = p.cond.fixedW.map(f => `<strong>${h(f.team)}</strong> gana ${h(escPhaseName(f.m)).toLowerCase()}`).join(' · ');
    const champs = Object.keys(p.cond.champDist || {})
      .sort((a, b) => p.cond.champDist[b] - p.cond.champDist[a]).slice(0, 4)
      .map(c => `${h(c)} (${p.cond.champDist[c]})`).join(', ');
    need = `<div class="esc-need">Lidera en <strong>${p.cond.n} de ${S.N}</strong> escenarios (a nivel de signo).`
      + (fixed ? ` En todos ellos: ${fixed}.` : ' Tiene varios caminos: no depende de un solo resultado.')
      + (champs ? ` Campeones que más le sirven: ${champs}.` : '') + '</div>';
  } else {
    let ej = '';
    if (p.example && S.champTable) {
      const fm = S.pending.find(m => m.phase === 'final');
      if (fm) ej = ` Un camino posible: campeón <strong>${h(p.example.winners[fm.num])}</strong>.`;
    }
    need = `<div class="esc-need">Sigue vivo, pero no lidera en ningún escenario a nivel de solo signo: `
      + `necesita marcadores exactos o empates a su favor, y que los punteros fallen.${ej}</div>`;
  }

  return `<details class="esc-player${p.vivo ? '' : ' out'}">
    <summary><span class="esc-pnum">${p.pos}</span><span class="esc-pname">${h(p.name)}</span>
    <span class="esc-pstats"><span><strong>${p.current}</strong>${p.bonus ? `<span class="esc-bonus">+${p.bonus}</span>` : ''} pts</span><span class="pt">techo ${p.techo}</span></span>
    ${p.vivo ? '<span class="esc-pill ok">VIVO</span>' : '<span class="esc-pill out">ELIMINADO</span>'}</summary>
    <div class="esc-pbody">${need}
    <h4>Picks pendientes (tachado = ya imposible)</h4>${segRows || ''}${honorRow}${awardsRow}
    <h4>Cruces pronosticados que aún pueden ocurrir (signo/exacto)</h4>${crucesRows}
    </div></details>`;
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    document.getElementById('page-title').textContent = data.clas?.title || 'Quiniela Mundial 2026';
    document.getElementById('updated-at').textContent = 'Actualizado: ' + (data.updated_at || '');
    document.getElementById('loading').style.display = 'none';

    DAILY_DAYS = data.daily || [];
    FIXTURE_DAYS = buildFixtureDays(data.fixture || []);

    // Tablas de posiciones: usar las del Excel (data.groups) si existen; si no,
    // calcularlas al vuelo desde los resultados del fixture (siempre actuales).
    GROUPS_BY_NAME = {};
    if (Array.isArray(data.groups) && data.groups.length) {
      data.groups.forEach(g => { GROUPS_BY_NAME[g.name] = g.teams || []; });
    } else {
      GROUPS_BY_NAME = computeGroupStandings(data.fixture || []);
    }
    // Índices que dependen del fixture: detalle jugador y cruces eliminatorios.
    // Deben construirse antes de elegir el día por defecto y de renderizar.
    buildPlayerDetailIndex(data);   // define FIXTURE_ALL / FIXTURE_BY_NAME
    buildKnockoutIndex(data);       // define KO_PRED_BY_MATCH (usa FIXTURE_BY_NAME)
    buildPredResDays();             // une días de grupos + eliminatorias (usa FIXTURE_ALL)
    // La proyección de la Recta Final depende de los índices anteriores: se
    // invalida aquí y se recalcula la próxima vez que se abra esa pestaña.
    ESC_STATE = null;
    if (document.querySelector('.tab-btn[data-tab="escenarios"].active')) ensureEscenarios();

    // Default the selectors to today's day if it exists, else the first day.
    const todayIso = venezuelaTodayIso();
    const todayIdx = DAILY_DAYS.findIndex(d => d.date === todayIso);
    dailyPredIdx = dailyClasIdx = (todayIdx >= 0 ? todayIdx : 0);
    const todayPrIdx = PRED_RES_DAYS.findIndex(d => d.iso === todayIso);
    predResIdx = (todayPrIdx >= 0 ? todayPrIdx : 0);
    const todayFixIdx = FIXTURE_DAYS.findIndex(d => d.iso === todayIso);
    partidosDiaIdx = (todayFixIdx >= 0 ? todayFixIdx : 0);

    renderClas(data);
    setupClasSearch();
    renderPlayerDetail();
    renderFixture(data.fixture || []);
    renderPartidosDia();
    renderDailyPred();
    renderPredResultados();
    renderDailyClas();

    const n = (data.clas?.players || []).length;
    document.getElementById('footer').textContent =
      `${n} participantes · ${data.fixture?.length || 0} partidos · ${data.updated_at}`;

  } catch (e) {
    document.getElementById('loading').textContent = 'Error al cargar datos: ' + e.message;
  }
}

load();
</script>
