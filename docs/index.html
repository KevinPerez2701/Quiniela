<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Pedir al navegador que no cachee el HTML (los datos ya van cache-busted) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Quiniela Mundial 2026</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    :root {
      --navy:   #1a2e5a;
      --navy2:  #0f1e3d;
      --gold:   #f5c518;
      --gold2:  #e0a800;
      --green:  #006d3b;
      --green2: #005530;
      --light:  #f0f4ff;
      --stripe: #dce7ff;
      --border: #b0bfd8;
      --text:   #1a1a2e;
      --muted:  #6b7a99;
      --white:  #ffffff;
      --tabbar-h: 46px;   /* alto aproximado de la barra de pestañas fija */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0d1b3e 0%, #1a3a6e 50%, #0d1b3e 100%);
      min-height: 100vh;
      padding: 20px 10px 40px;
      color: var(--text);
    }

    .wrapper { max-width: 1440px; margin: 0 auto; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 {
      color: var(--gold);
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .header .subtitle { color: #a0b8e8; font-size: .82rem; margin-top: 5px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      margin-bottom: 0;
      padding: 8px 4px 0;
      /* Barra fija arriba + scroll horizontal en pantallas chicas */
      position: sticky;
      top: 0;
      z-index: 30;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: linear-gradient(180deg, #0d1b3e 60%, rgba(13,27,62,0));
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 9px 16px;
      border: none;
      border-radius: 8px 8px 0 0;
      background: rgba(255,255,255,.12);
      color: #c0d4ff;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .tab-btn:hover  { background: rgba(255,255,255,.22); color: #fff; }
    .tab-btn.active { background: #fff; color: var(--navy); }

    /* ── Card ── */
    .card {
      background: var(--white);
      border-radius: 0 8px 8px 8px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.45);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .table-wrap { overflow-x: auto; }

    /* ── Base table ── */
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #e2e8f4; border-right: 1px solid #e2e8f4; }
    tbody tr:nth-child(odd)  { background: var(--white); }
    tbody tr:nth-child(even) { background: var(--stripe); }
    tbody tr:hover           { background: #c8d8ff; }
    td { text-align: center; }
    td.left, th.left { text-align: left; }

    /* ── CLAS table ── */
    thead tr.maxrow th {
      background: #e8edf8; color: var(--muted);
      font-size: .68rem; font-weight: 600; padding: 3px 8px;
      border-bottom: 1px solid var(--border); text-align: center;
      white-space: nowrap;
    }
    thead tr.colrow th {
      background: var(--navy); color: var(--white);
      font-weight: 700; padding: 9px 8px;
      white-space: nowrap; text-align: center;
      border-right: 1px solid rgba(255,255,255,.08); font-size: .73rem;
    }
    thead tr.colrow th.pts-col { background: var(--green); min-width: 76px; }

    .pos-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      font-weight: 700; font-size: .75rem;
    }
    .pos-1     { background: var(--gold); color: #333; }
    .pos-2     { background: #c0c0c0;     color: #333; }
    .pos-3     { background: #cd7f32;     color: #fff; }
    .pos-other { background: #e2e8f4;     color: var(--text); }
    .player-name { font-weight: 600; color: var(--navy); }
    td.pts-cell { font-weight: 800; font-size: .93rem; color: var(--green); }

    .bar-wrap { display: flex; align-items: center; gap: 4px; }
    .bar-outer { flex: 1; height: 5px; background: #dde4f0; border-radius: 3px; min-width: 36px; }
    .bar-inner { height: 100%; border-radius: 3px; background: linear-gradient(90deg,#3a7bd5,#00c6ff); }
    .bar-val   { min-width: 16px; text-align: right; font-size: .76rem; }

    /* ── FIXTURE ── */
    .phase-header {
      background: var(--navy2);
      color: var(--gold);
      font-weight: 700;
      font-size: .82rem;
      padding: 8px 14px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .group-header {
      background: #2e4a8a;
      color: #cde;
      font-weight: 600;
      font-size: .76rem;
      padding: 5px 14px;
      letter-spacing: .02em;
    }
    .fixture-table th {
      background: var(--navy);
      color: var(--white);
      font-size: .73rem;
      font-weight: 600;
      padding: 7px 8px;
      white-space: nowrap;
      text-align: center;
    }
    .fixture-table td { font-size: .8rem; }
    .fixture-table td.team { font-weight: 600; color: var(--navy); }
    .score-cell { font-weight: 800; font-size: .95rem; color: var(--green); }
    .score-cell.pending { color: var(--muted); font-weight: 400; font-size: .8rem; }
    /* Live (API) score shown only until the admin enters the official result. */
    .score-cell.live-now   { color: var(--gold); }
    .score-cell.live-now::after { content: ' \25CF'; color: #e74c3c; font-size: .55rem; vertical-align: middle; }
    .score-cell.live-final { color: var(--green); opacity: .8; }
    /* Penalty-shootout annotation, e.g. "1 - 1 (p 5-6)". */
    .pen-note { font-size: .68rem; font-weight: 600; color: var(--muted); }

    /* ── FIXTURE phase sub-nav ── */
    .phase-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 14px;
      background: var(--navy2);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .phase-nav::-webkit-scrollbar { display: none; }
    .phase-pill {
      padding: 7px 14px;
      border: 1px solid rgba(245,197,24,.4);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #c0d4ff;
      font-size: .76rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .phase-pill:hover { background: rgba(255,255,255,.2); color: #fff; }
    .phase-pill.active {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold2);
    }

    /* ── DAILY PREDICTION / DAILY CLAS shared ── */
    .daily-header {
      padding: 14px 18px;
      background: var(--navy);
      color: var(--white);
      font-size: .88rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .daily-header strong { color: var(--gold); }
    .day-select {
      font-size: .9rem;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: var(--white);
      color: var(--navy);
      font-weight: 600;
      cursor: pointer;
      max-width: 100%;
    }

    /* Scrollable table wrapper with sticky first columns */
    .daily-scroll-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .daily-scroll-wrap table { min-width: 100%; }

    /* Sticky name column (and pos column for daily-clas) */
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 2;
      background: inherit;
    }
    tbody tr:nth-child(odd)  .sticky-col { background: var(--white); }
    tbody tr:nth-child(even) .sticky-col { background: var(--stripe); }
    tbody tr:hover           .sticky-col { background: #c8d8ff; }

    .daily-table th {
      background: var(--navy);
      color: var(--white);
      font-size: .73rem;
      padding: 8px 10px;
      white-space: nowrap;
      text-align: center;
    }
    .daily-table th.sticky-col { left: 0; z-index: 3; background: var(--navy); }
    .pred-cell { font-size: .82rem; }
    .pred-null { color: #bbb; font-size: .75rem; }

    /* ── DAILY CLAS ── */
    .daily-clas-table th {
      background: var(--green);
      color: var(--white);
      font-size: .73rem;
      padding: 8px 10px;
      white-space: nowrap;
      text-align: center;
    }
    .daily-clas-table th.sticky-col { left: 0; z-index: 3; background: var(--green); }
    .daily-clas-table th.sticky-col-2 { left: 42px; z-index: 3; background: var(--green); }
    .sticky-col-2 {
      position: sticky;
      left: 42px;
      z-index: 2;
      background: inherit;
    }
    tbody tr:nth-child(odd)  .sticky-col-2 { background: var(--white); }
    tbody tr:nth-child(even) .sticky-col-2 { background: var(--stripe); }
    tbody tr:hover           .sticky-col-2 { background: #c8d8ff; }
    .pts-day { font-weight: 800; color: var(--green); }

    /* ── PREDICCIÓN RESULTADOS ── */
    .pred-res-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .pred-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 2px 10px rgba(13,27,62,.07);
      display: flex;
      flex-direction: column;
    }
    .pred-card-head {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: var(--gold);
      font-weight: 700;
      font-size: .84rem;
      padding: 10px 12px;
      text-align: center;
      line-height: 1.25;
    }
    .pred-card-sub {
      font-size: .68rem;
      color: var(--muted);
      text-align: center;
      padding: 4px 8px;
      background: #f3f6fd;
      border-bottom: 1px solid #e2e8f4;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .pred-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border-bottom: 1px solid #eef2fa;
    }
    .pred-row:last-child { border-bottom: none; }
    .pred-row.top { background: #fff8e1; }
    .res-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: 700; font-size: .82rem; color: var(--navy);
    }
    .res-sign {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 5px;
      font-size: .72rem; font-weight: 800; color: #fff; flex: none;
    }
    .sign-1 { background: var(--green); }
    .sign-X { background: #6b7a99; }
    .sign-2 { background: #1565c0; }
    .res-count { font-weight: 800; color: var(--navy); min-width: 22px; text-align: right;
      display: inline-flex; align-items: center; justify-content: flex-end; gap: 5px; }
    .pred-empty { padding: 16px; text-align: center; color: var(--muted); font-size: .8rem; }

    /* ── Desplegable: jugadores que eligieron un resultado ── */
    .pred-row.clickable { cursor: pointer; transition: background .12s; }
    .pred-row.clickable:hover { background: #eef4ff; }
    .pred-row.open { background: #e8f0ff; }
    .pred-chev { font-size: .58rem; color: var(--muted); transition: transform .15s; }
    .pred-row.open .pred-chev { transform: rotate(180deg); color: var(--navy); }
    .pred-names {
      padding: 9px 12px 12px; background: #f7faff; border-bottom: 1px solid #eef2fa;
      display: flex; flex-wrap: wrap; gap: 6px; animation: predDrop .18s ease;
    }
    @keyframes predDrop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .pred-name-chip {
      background: var(--white); border: 1px solid var(--border); border-radius: 99px;
      padding: 3px 10px; font-size: .74rem; color: var(--navy); font-weight: 600;
    }
    .pred-names-empty { font-size: .74rem; color: var(--muted); }

    /* ── Cruces eliminatorios (Predicción Resultados, 16avos en adelante) ── */
    .pred-res-note {
      padding: 12px 16px; font-size: .78rem; color: #46587e; line-height: 1.45;
      background: #f7f9ff; border-bottom: 1px solid var(--border);
    }
    .pred-res-note strong { color: var(--navy); }
    .ko-vs { color: #b9c6e6; font-weight: 600; font-size: .82em; margin: 0 2px; }
    .ko-confirm { color: #38d27a; font-weight: 800; }
    .ko-pending { color: var(--gold); font-weight: 800; }
    .ko-section {
      font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); padding: 9px 12px 3px; background: #fbfcff; border-top: 1px solid #eef2fa;
    }
    .ko-static { border-bottom: 1px solid #eef2fa; }

    /* ── Detalle Jugador: control segmentado de 3 vistas ── */
    .pd-views {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 10px 14px; background: #eef3ff; border-bottom: 1px solid var(--border);
    }
    .pd-view-btn {
      padding: 7px 14px; border: 1px solid var(--border); background: var(--white);
      color: var(--navy); border-radius: 8px; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .pd-view-btn:hover  { background: #dbe6ff; }
    .pd-view-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    /* ── Posición Grupos (cards por grupo) ── */
    .pd-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px; padding: 16px;
    }
    .pos-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .pos-table th {
      background: #243b6b; color: #fff; font-size: .66rem; font-weight: 700;
      padding: 5px 7px; text-align: left; white-space: nowrap;
    }
    .pos-table td { padding: 6px 7px; border-bottom: 1px solid #eef2fa; }
    .pos-table td.pos-n { width: 26px; text-align: center; color: var(--muted); font-weight: 700; }
    .pos-table td.pos-pred { font-weight: 600; color: var(--navy); }
    .pos-table td.pos-real { color: #46587e; }
    .pos-table td.pos-pts  { width: 30px; text-align: right; font-weight: 800; color: var(--muted); }
    .pos-table tr.hit td.pos-pred { color: #1c7a44; }
    .pos-table tr.hit td.pos-pts  { color: var(--green); }
    .pos-table tr.hit { background: #eefcf3; }

    /* ── Equipos Clasificados (chips por ronda) ── */
    .qual-grid { display: flex; flex-wrap: wrap; gap: 7px; padding: 11px 13px; }
    .qual-chip {
      background: var(--white); border: 1px solid var(--border); border-radius: 99px;
      padding: 3px 11px; font-size: .77rem; color: var(--navy); font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .qual-chip.hit { background: #eefcf3; border-color: #9bdcb6; color: #1c7a44; }
    .qual-chip .qp { font-size: .64rem; color: var(--green); font-weight: 800; }
    .qual-chip.miss { opacity: .72; }
    .qual-role {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
      padding: 7px 13px; border-bottom: 1px solid #eef2fa; font-size: .8rem;
    }
    .qual-role:last-child { border-bottom: none; }
    .qual-role .qr-lbl  { color: var(--muted); font-size: .72rem; }
    .qual-role .qr-team { font-weight: 600; color: var(--navy); text-align: right; }
    .qual-role.hit .qr-team { color: #1c7a44; }
    .qual-role .qr-pts  { font-weight: 800; color: var(--muted); min-width: 26px; text-align: right; }
    .qual-role.hit .qr-pts { color: var(--green); }
    .pd-note { padding: 10px 16px; font-size: .76rem; color: var(--muted); background: #f7f9ff; border-bottom: 1px solid var(--border); line-height: 1.4; }

    /* ── Podio (resalta top-3 en la Clasificación) ── */
    #clas-body tr.podium-1 td:first-child { box-shadow: inset 4px 0 0 var(--gold); }
    #clas-body tr.podium-2 td:first-child { box-shadow: inset 4px 0 0 #c0c0c0; }
    #clas-body tr.podium-3 td:first-child { box-shadow: inset 4px 0 0 #cd7f32; }
    #clas-body tr.podium-1 { background: linear-gradient(90deg, rgba(245,197,24,.12), transparent 40%); }

    /* ── Toolbar + buscador de jugador ── */
    .panel-toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 12px 14px; background: #f7f9ff; border-bottom: 1px solid var(--border);
    }
    .search-wrap {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px; min-width: 220px; max-width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,197,24,.25); }
    .search-ico { font-size: .9rem; opacity: .6; }
    .player-search {
      border: none; outline: none; background: transparent;
      font-size: .85rem; color: var(--text); flex: 1; min-width: 120px;
    }
    .search-count { font-size: .72rem; color: var(--muted); white-space: nowrap; }

    /* ── Estado vacío unificado ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 40px 20px; color: var(--muted); text-align: center;
    }
    .empty-state .ico { font-size: 1.8rem; opacity: .5; }
    .empty-state .msg { font-size: .85rem; }

    /* ── Spinner de carga ── */
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 14px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Pill "Actualizado" en el header ── */
    .header .subtitle {
      display: inline-block;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(245,197,24,.35);
      color: #d8e4ff;
      padding: 4px 12px; border-radius: 999px;
    }

    /* ── TABLA DE POSICIONES (grupos en Fixture) ── */
    .standings-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .standings-table th {
      background: #243b6b; color: var(--white);
      font-size: .68rem; font-weight: 700; padding: 6px 6px;
      white-space: nowrap; text-align: center;
    }
    .standings-table th.left { text-align: left; }
    .standings-table td { padding: 6px 6px; text-align: center; border-bottom: 1px solid #e2e8f4; }
    .standings-table td.team { font-weight: 600; color: var(--navy); }
    .standings-table td.st-pts { font-weight: 800; color: var(--green); }
    .standings-table tbody tr:nth-child(even) { background: var(--stripe); }
    .standings-table tbody tr:hover { background: #c8d8ff; }
    /* Top 2 (clasifican directo) marcados con franja verde a la izquierda */
    .standings-table tbody tr.qualify td:first-child { box-shadow: inset 4px 0 0 var(--green); }
    .st-dg-pos { color: var(--green); }
    .st-dg-neg { color: #c0392b; }
    .standings-wrap { padding: 0 0 4px; }

    /* ── DETALLE JUGADOR ── */
    .pd-summary {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 12px 14px; background: #f7f9ff; border-bottom: 1px solid var(--border);
    }
    .pd-stat {
      flex: 1 1 130px; min-width: 120px;
      background: var(--white); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; text-align: center;
    }
    .pd-stat .pd-stat-val { font-size: 1.25rem; font-weight: 800; color: var(--navy); line-height: 1.1; }
    .pd-stat .pd-stat-val.green { color: var(--green); }
    .pd-stat .pd-stat-lbl { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }

    .pd-table td.score { white-space: nowrap; }
    .pd-table .score-real, .pd-table .score-pred {
      display: inline-flex; align-items: center; gap: 6px; justify-content: center;
      font-weight: 700; color: var(--navy);
    }
    .pd-table .pred-null { color: #bbb; font-size: .8rem; font-weight: 400; }

<script>
// ── Tab logic ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    // Marcador en vivo: poll solo mientras "Partidos del Día" esté abierto.
    if (btn.dataset.tab === 'partidos-dia') startLivePolling(); else stopLivePolling();
  });
});

// ── Helpers ──────────────────────────────────────────────────────────────────
const h = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

// Fecha de "hoy" en horario de Venezuela (America/Caracas, UTC-4), sin importar
// la zona horaria del navegador del visitante. Devuelve 'YYYY-MM-DD'.
function venezuelaTodayIso() {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Caracas',
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  } catch (e) {
    // Respaldo: aplicar el desfase fijo de -4h manualmente
    return new Date(Date.now() - 4 * 3600 * 1000).toISOString().slice(0, 10);
  }
}

// Estado vacío reutilizable
function emptyState(msg, ico = '📭') {
  return `<div class="empty-state"><div class="ico">${ico}</div><div class="msg">${h(msg)}</div></div>`;
}

// Filtra filas de una tabla por nombre de jugador (.player-name). Devuelve nº visibles.
function filterPlayerRows(tbody, query) {
  const q = (query || '').trim().toLowerCase();
  let shown = 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const name = (tr.querySelector('.player-name')?.textContent || '').toLowerCase();
    const match = !q || name.includes(q);
    tr.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  return shown;
}

// Construye un buscador "🔎 [input]" reutilizable para las pestañas diarias
function buildSearchBox(initial, placeholder, onInput) {
  const wrap = document.createElement('span');
  wrap.className = 'search-wrap';
  wrap.innerHTML = `<span class="search-ico">🔎</span>`;
  const inp = document.createElement('input');
  inp.type = 'search';
  inp.className = 'player-search';
  inp.placeholder = placeholder;
  inp.autocomplete = 'off';
  inp.value = initial || '';
  inp.addEventListener('input', () => onInput(inp.value));
  wrap.appendChild(inp);
  return wrap;
}

function posBadge(pos) {
  const cls = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-other';
  return `<span class="pos-badge ${cls}">${pos}</span>`;
}

function barCell(val, max) {
  if (!max) return `<span>${val}</span>`;
  const pct = Math.min(100, Math.round((val / max) * 100));
  return `<div class="bar-wrap">
    <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
    <span class="bar-val">${val}</span>
  </div>`;
}

function fmtDate(str) {
  if (!str) return '—';
  // str like "2026-06-11 15:00"
  const [date, time] = str.split(' ');
  const [y, m, d] = date.split('-');
  return `${d}/${m} ${time || ''}`.trim();
}

// ── CLAS ─────────────────────────────────────────────────────────────────────
const SCORE_COLS = ['f_grupos','pos_grupos','eq_16','pt_16','eq_8','pt_8','eq_4','pt_4','eq_2','pt_2','eq_34','eq_final','pt_34','pt_final','honor'];

function renderClas(data) {
  const maxValues = data.max_values || {};
  const cols = data.columns || [];
  const maxRow = document.getElementById('max-row');
  const colRow = document.getElementById('col-row');

  cols.forEach(([key]) => {
    const th1 = document.createElement('th');
    th1.textContent = maxValues[key] ? 'Máx: ' + maxValues[key] : '';
    if (key === 'pos' || key === 'jugador') th1.className = 'left';
    maxRow.appendChild(th1);

    const th2 = document.createElement('th');
    const label = cols.find(c => c[0] === key)?.[1] || key;
    th2.textContent = label;
    if (key === 'pos')     th2.className = 'left';
    if (key === 'jugador') th2.className = 'left';
    if (key === 'puntos')  th2.className = 'pts-col';
    colRow.appendChild(th2);
  });

  const tbody = document.getElementById('clas-body');
  (data.clas?.players || data.players || []).forEach(p => {
    const tr = document.createElement('tr');
    if (p.pos >= 1 && p.pos <= 3) tr.classList.add('podium-' + p.pos);
    cols.forEach(([key]) => {
      const td = document.createElement('td');
      if (key === 'pos') {
        td.innerHTML = posBadge(p.pos);
      } else if (key === 'jugador') {
        td.className = 'left';
        td.innerHTML = `<span class="player-name">${h(p.jugador)}</span>`;
      } else if (key === 'puntos') {
        td.className = 'pts-cell';
        td.textContent = p.puntos;
      } else if (SCORE_COLS.includes(key)) {
        td.innerHTML = barCell(p[key] || 0, maxValues[key] || 0);
      } else {
        td.textContent = p[key] ?? 0;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// Buscador de jugador para la Clasificación
function setupClasSearch() {
  const input = document.getElementById('clas-search');
  const counter = document.getElementById('clas-search-count');
  const tbody = document.getElementById('clas-body');
  if (!input || !tbody) return;
  const total = tbody.querySelectorAll('tr').length;
  const apply = () => {
    const shown = filterPlayerRows(tbody, input.value);
    counter.textContent = input.value.trim()
      ? `${shown} de ${total} jugadores`
      : `${total} jugadores`;
  };
  input.addEventListener('input', apply);
  apply();
}

// ── TABLAS DE POSICIONES (grupos) ──────────────────────────────────────────────
// GROUPS_BY_NAME["Grupo A"] = [{pos, team, pts, pj, g, e, p, gf, gc, dg}, ...]
// Fuente preferida: data.groups (transcrito del Excel, ya con el desempate oficial).
// Si aún no está en data.json, se calculan al vuelo desde los resultados del fixture.
let GROUPS_BY_NAME = {};

function computeGroupStandings(matches) {
  const groups = {};   // grp -> { team -> stats }
  const seen = {};     // grp -> [team, ...] (orden de aparición, desempate final)
  matches.forEach(m => {
    if (m.phase !== 'grupos' || !m.group) return;
    const g = m.group;
    groups[g] = groups[g] || {};
    seen[g] = seen[g] || [];
    [m.home, m.away].forEach(team => {
      if (!seen[g].includes(team)) seen[g].push(team);
      groups[g][team] = groups[g][team] ||
        { team, pts: 0, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0 };
    });
    if (m.goal_home === null || m.goal_away === null) return;
    const H = groups[g][m.home], A = groups[g][m.away];
    H.pj++; A.pj++; H.gf += m.goal_home; H.gc += m.goal_away;
    A.gf += m.goal_away; A.gc += m.goal_home;
    if (m.goal_home > m.goal_away)      { H.pts += 3; H.g++; A.p++; }
    else if (m.goal_home < m.goal_away) { A.pts += 3; A.g++; H.p++; }
    else                                { H.pts++; A.pts++; H.e++; A.e++; }
  });
  const out = {};
  Object.keys(groups).forEach(g => {
    const idx = {};
    seen[g].forEach((t, i) => idx[t] = i);
    const teams = Object.values(groups[g]);
    teams.forEach(t => t.dg = t.gf - t.gc);
    teams.sort((a, b) =>
      b.pts - a.pts || b.dg - a.dg || b.gf - a.gf || idx[a.team] - idx[b.team]);
    teams.forEach((t, i) => t.pos = i + 1);
    out[g] = teams;
  });
  return out;
}

function fmtDG(dg) {
  const cls = dg > 0 ? 'st-dg-pos' : dg < 0 ? 'st-dg-neg' : '';
  const txt = dg > 0 ? '+' + dg : String(dg);
  return `<span class="${cls}">${txt}</span>`;
}

function buildStandingsTable(teams) {
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap standings-wrap';
  const t = document.createElement('table');
  t.className = 'standings-table';
  t.innerHTML = `<thead><tr>
    <th>Pos</th><th class="left">Selección</th>
    <th>Pts</th><th>J</th><th>G</th><th>E</th><th>P</th>
    <th>GF</th><th>GC</th><th>DG</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  teams.forEach(s => {
    const tr = document.createElement('tr');
    if (s.pos <= 2) tr.classList.add('qualify');   // top 2 clasifican directo
    tr.innerHTML = `
      <td>${posBadge(s.pos)}</td>
      <td class="team left">${h(s.team)}</td>
      <td class="st-pts">${s.pts}</td>
      <td>${s.pj ?? s.j ?? 0}</td>
      <td>${s.g}</td><td>${s.e}</td><td>${s.p}</td>
      <td>${s.gf}</td><td>${s.gc}</td><td>${fmtDG(s.dg)}</td>`;
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

// ── FIXTURE ───────────────────────────────────────────────────────────────────
const FIXTURE_PHASE_ORDER = ['grupos','dieciseisavos','octavos','cuartos','semis','tercero','final'];
let FIXTURE_PHASES = [];   // [{ phase, label, list:[...] }, ...] sólo fases con partidos
let fixturePhaseIdx = 0;   // índice de la fase seleccionada dentro de FIXTURE_PHASES

// Construye una <div> con la sección de una fase (cabecera + tablas).
function buildPhaseSection(phaseEntry) {
  const { phase, label, list } = phaseEntry;
  const phDiv = document.createElement('div');
  phDiv.innerHTML = `<div class="phase-header">${h(label)}</div>`;

  if (phase === 'grupos') {
    // sub-group
    const byGroup = {};
    list.forEach(m => (byGroup[m.group || ''] = byGroup[m.group || ''] || []).push(m));
    Object.entries(byGroup).sort(([a],[b]) => a.localeCompare(b)).forEach(([grp, ms]) => {
      phDiv.innerHTML += `<div class="group-header">${h(grp)}</div>`;
      const standings = GROUPS_BY_NAME[grp];
      if (standings && standings.length) phDiv.appendChild(buildStandingsTable(standings));
      phDiv.appendChild(buildMatchTable(ms));
    });
  } else {
    phDiv.appendChild(buildMatchTable(list));
  }
  return phDiv;
}

// (Re)dibuja la barra de fases + la sección de la fase seleccionada.
function renderFixturePhase() {
  const el = document.getElementById('fixture-content');
  el.innerHTML = '';
  if (!FIXTURE_PHASES.length) return;

  // Mantener el índice dentro de rango.
  if (fixturePhaseIdx < 0 || fixturePhaseIdx >= FIXTURE_PHASES.length) fixturePhaseIdx = 0;

  // Barra de pills, una por fase con partidos, en orden de torneo.
  const nav = document.createElement('div');
  nav.className = 'phase-nav';
  FIXTURE_PHASES.forEach((ph, i) => {
    const btn = document.createElement('button');
    btn.className = 'phase-pill' + (i === fixturePhaseIdx ? ' active' : '');
    btn.textContent = ph.label;
    btn.addEventListener('click', () => {
      fixturePhaseIdx = i;
      renderFixturePhase();
    });
    nav.appendChild(btn);
  });
  el.appendChild(nav);

  // Sección de la fase seleccionada.
  el.appendChild(buildPhaseSection(FIXTURE_PHASES[fixturePhaseIdx]));
}

function renderFixture(matches) {
  // Group by phase
  const byPhase = {};
  matches.forEach(m => {
    (byPhase[m.phase] = byPhase[m.phase] || []).push(m);
  });

  // Sólo fases que realmente tienen partidos, en orden de torneo.
  FIXTURE_PHASES = FIXTURE_PHASE_ORDER
    .filter(phase => byPhase[phase] && byPhase[phase].length)
    .map(phase => ({
      phase,
      label: byPhase[phase][0].phase_label,
      list: byPhase[phase],
    }));

  // Fase por defecto: la que contiene partidos de hoy; si no hay, la primera.
  const todayIso = venezuelaTodayIso();
  const todayPhaseIdx = FIXTURE_PHASES.findIndex(
    ph => ph.list.some(m => (m.date || '').slice(0, 10) === todayIso)
  );
  fixturePhaseIdx = (todayPhaseIdx >= 0 ? todayPhaseIdx : 0);

  renderFixturePhase();
}

function buildMatchTable(matches) {
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const t = document.createElement('table');
  t.className = 'fixture-table';
  t.innerHTML = `<thead><tr>
    <th>#</th><th>Fecha (UTC-4)</th><th class="left">Local</th>
    <th>Resultado</th><th class="left">Visitante</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  matches.forEach(m => {
    const played = m.goal_home !== null && m.goal_away !== null;
    const score = played
      ? `<span class="score-cell">${m.goal_home} - ${m.goal_away}${penNote(m.pen_home, m.pen_away)}</span>`
      : `<span class="score-cell pending">vs</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:var(--muted);font-size:.75rem">${m.num || ''}</td>
      <td style="white-space:nowrap;font-size:.75rem">${fmtDate(m.date)}</td>
      <td class="team left">${h(m.home)}</td>
      <td>${score}</td>
      <td class="team left">${h(m.away)}</td>
    `;
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

// ── PARTIDOS DEL DÍA (fixture grouped by calendar day, with times) ────────────
let FIXTURE_DAYS = [];        // [{ iso, label, matches:[...] }, ...]
let partidosDiaIdx = 0;

const WEEKDAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function fmtTime(str) {
  if (!str) return '';
  const t = str.split(' ')[1];
  return t || '';
}

function dayLabel(iso) {
  // iso like "2026-06-11" — build label without timezone drift
  const [y, m, d] = iso.split('-').map(Number);
  const wd = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  return `${wd} ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
}

function buildFixtureDays(matches) {
  const byDay = {};
  matches.forEach(m => {
    if (!m.date) return;
    const iso = m.date.split(' ')[0];
    (byDay[iso] = byDay[iso] || []).push(m);
  });
  return Object.keys(byDay).sort().map(iso => {
    const list = byDay[iso].slice().sort((a, b) =>
      (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0)
    );
    return { iso, label: dayLabel(iso), matches: list };
  });
}

// ── LIVE SCORES (football-data.org vía Cloudflare Worker) ─────────────────────
// SOLO visualización: muestra el marcador actual/último de la API para los
// partidos de HOY que el admin aún no ha capturado. NUNCA escribe scores.json ni
// afecta los puntos (de eso se encarga el Action auto-scores.yml al FINISHED).
// Pega aquí la URL de tu Worker para encender la función ('' = apagada).
const LIVE_SCORES_WORKER_URL = 'https://dark-tooth-2a90.kevinperez9a.workers.dev/';   // p. ej. 'https://wc-scores.tu-sub.workers.dev'
const LIVE_POLL_MS = 45000;          // refresco del navegador (la API se cachea en el Worker)

// Mapa nombre-en-fixture (ES) -> nombre football-data.org (EN). Copia canónica
// en scripts/teams_es_en.json (úsalos en conjunto si agregas/renombras equipos).
const LIVE_TEAM_MAP = {
  'Alemania':'Germany','Arabia Saudita':'Saudi Arabia','Argelia':'Algeria','Argentina':'Argentina',
  'Australia':'Australia','Austria':'Austria','Bosnia y Herzegovina':'Bosnia-Herzegovina','Brasil':'Brazil',
  'Bélgica':'Belgium','Cabo Verde':'Cape Verde Islands','Canadá':'Canada','Catar':'Qatar','Colombia':'Colombia',
  'Corea del Sur':'South Korea','Costa de Marfil':'Ivory Coast','Croacia':'Croatia','Curazao':'Curaçao',
  'Ecuador':'Ecuador','Egipto':'Egypt','Escocia':'Scotland','España':'Spain','Estados Unidos':'United States',
  'Francia':'France','Ghana':'Ghana','Haití':'Haiti','Inglaterra':'England','Irak':'Iraq','Irán':'Iran',
  'Japón':'Japan','Jordania':'Jordan','Marruecos':'Morocco','México':'Mexico','Noruega':'Norway',
  'Nueva Zelanda':'New Zealand','Panamá':'Panama','Paraguay':'Paraguay','Países Bajos':'Netherlands',
  'Portugal':'Portugal','RD Congo':'Congo DR','República Checa':'Czechia','Senegal':'Senegal',
  'Sudáfrica':'South Africa','Suecia':'Sweden','Suiza':'Switzerland','Turquía':'Turkey','Túnez':'Tunisia',
  'Uruguay':'Uruguay','Uzbekistán':'Uzbekistan'
};
let LIVE_BY_PAIR = {};   // "Home|Away" (EN) -> { status, hs, as }
let LIVE_TIMER = null;

// Marcador en vivo de la API para un partido del fixture, o null si no aplica.
function liveScoreFor(m) {
  const eh = LIVE_TEAM_MAP[m.home], ea = LIVE_TEAM_MAP[m.away];
  if (!eh || !ea) return null;
  const api = LIVE_BY_PAIR[eh + '|' + ea];
  if (!api || api.hs == null || api.as == null) return null;
  // football-data marca los partidos en juego como 'IN_PLAY' o 'LIVE' (y 'PAUSED'
  // en el descanso). Mostramos el marcador de cualquier partido ya iniciado; solo
  // ocultamos los que aún no arrancan (sus goles son null de todas formas).
  if (api.status === 'SCHEDULED' || api.status === 'TIMED') return null;
  return api;
}

// Anotación de penales "(p 5-6)" para eliminatorias definidas en la tanda.
function penNote(ph, pa) {
  return (ph != null && pa != null)
    ? ` <span class="pen-note">(p ${ph}-${pa})</span>`
    : '';
}

// HTML de la celda de resultado: oficial (admin) manda; si no hay, marcador de la
// API (en vivo / final no confirmado); si tampoco, "vs".
function partidoScoreHtml(m) {
  if (m.goal_home !== null && m.goal_away !== null)
    return `<span class="score-cell">${m.goal_home} - ${m.goal_away}${penNote(m.pen_home, m.pen_away)}</span>`;
  const live = liveScoreFor(m);
  if (live) {
    const cls = live.status === 'FINISHED' ? 'live-final' : 'live-now';
    const tip = live.status === 'FINISHED' ? 'Final (aún no confirmado por admin)' : 'En juego (no oficial)';
    return `<span class="score-cell ${cls}" title="${tip}">${live.hs} - ${live.as}${penNote(live.ph, live.pa)}</span>`;
  }
  return `<span class="score-cell pending">vs</span>`;
}

async function fetchLiveScores() {
  if (!LIVE_SCORES_WORKER_URL) return false;
  try {
    const r = await fetch(LIVE_SCORES_WORKER_URL, { cache: 'no-store' });
    if (!r.ok) return false;
    const data = await r.json();
    const map = {};
    (data.matches || []).forEach(x => { if (x.home && x.away) map[x.home + '|' + x.away] = x; });
    LIVE_BY_PAIR = map;
    return true;
  } catch (e) { return false; }
}

function stopLivePolling() { if (LIVE_TIMER) { clearInterval(LIVE_TIMER); LIVE_TIMER = null; } }

    fetchLiveScores().then(ok => { if (ok) repaintPartidosDiaScores(); });

let dailyPredIdx = 0;         // selected day index for the prediction view
let dailyClasIdx = 0;         // selected day index for the clas view
let predResIdx = 0;           // selected day index for the result-count view

let KO_PRED_BY_MATCH = {};    // "Local-Visitante" -> [{jugador, parsed}] de fases eliminatorias

// ── DETALLE JUGADOR ───────────────────────────────────────────────────────────
let FIXTURE_ALL = [];         // lista completa de partidos del fixture
let FIXTURE_BY_NAME = {};     // "Local-Visitante" -> objeto partido del fixture
let PLAYER_MATCH_DATA = {};   // jugador -> { "Local-Visitante": {pred, pts} }
let CLAS_BY_NAME = {};        // jugador -> fila de clasificación (pos, puntos)

let PLAYER_QUAL_DATA = {};    // jugador -> { segKey: {name, order, items:[{label, predTeam, pts}]} }

// En la última jornada de grupos (24–27/06/2026) cada día trae 18 "partidos":
// los 6 primeros son juegos reales con marcador y los 12 restantes son
// pronósticos de posición de grupo (nombres de equipo). En "Predicción
// Resultados" solo mostramos los 6 juegos reales de esos días.
const PRED_RES_LIMIT_DATES = ['2026-06-24', '2026-06-25', '2026-06-26', '2026-06-27'];
const PRED_RES_LIMIT_COUNT = 6;

// Nº de partidos a mostrar en "Predicción Resultados" para un día dado
function predResCount(day) {
  const total = (day.matches || []).length;
  return PRED_RES_LIMIT_DATES.includes(day.date) ? Math.min(PRED_RES_LIMIT_COUNT, total) : total;
}

  return sel;
}

// ── PREDICCIÓN RESULTADOS ──────────────────────────────────────────────────────
// Días de grupos  -> cuenta cuántos eligieron cada resultado por partido.
// Días eliminatorios (16avos en adelante) -> valida el CRUCE: si ya está
// confirmado (ambos equipos reales en el fixture), lista a quienes acertaron el
// enfrentamiento y, entre ellos, desglosa por resultado; si el cruce aún no está
// definido, muestra la distribución de cruces pronosticados. El cruce se cuenta
// sin importar quién va de local o visitante (decidido con el usuario).

// ¿"2F", "1E", "3ABCDF", "W73", "L101"… (placeholder de bracket) en vez de equipo real?
function isPlaceholderTeam(t) {
  return /^\d/.test(t) || /^[WL]\d/.test(t);
}

// Clave de cruce sin orden: {A,B} == {B,A}  ->  "Brasil ∧ Japón"
function cruceKey(a, b) {
  return [String(a).trim(), String(b).trim()]
    .sort((x, y) => x.localeCompare(y, 'es'))
    .join(' ∧ ');
}

// Parsea "Cruce·Signo|Marcador" (separador U+00B7) -> {home, away, sign, score, res}
function parseKoPred(raw) {
  if (raw == null || raw === '') return null;
  const dot = raw.indexOf('·');
  if (dot < 0) return null;
  const cruce = raw.slice(0, dot).trim();
  const rest  = raw.slice(dot + 1);                 // "Signo|Marcador"
  const bar   = rest.indexOf('|');
  const sign  = bar >= 0 ? rest.slice(0, bar) : rest;
  const score = bar >= 0 ? rest.slice(bar + 1) : '';
  const dash  = cruce.indexOf('-');                 // ningún equipo del torneo lleva guion
  const home  = dash >= 0 ? cruce.slice(0, dash).trim() : cruce.trim();
  const away  = dash >= 0 ? cruce.slice(dash + 1).trim() : '';
  return { home, away, sign, score, res: sign + '|' + score };
}

function isoToLabel(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// KO_PRED_BY_MATCH["Local-Visitante"] = [{jugador, parsed}, ...]
// Se arma desde los grupos de fase del daily (sin fecha de calendario): solo las
// columnas cuyo rótulo coincide con un partido eliminatorio del fixture (las demás
// son columnas de "equipos que avanzan" y se ignoran).
function buildKnockoutIndex(data) {
  KO_PRED_BY_MATCH = {};
  (data.daily || []).forEach(day => {
    if (day.date) return;
    (day.matches || []).forEach((label, col) => {
      if (!(label in FIXTURE_BY_NAME)) return;
      const arr = KO_PRED_BY_MATCH[label] || (KO_PRED_BY_MATCH[label] = []);
      (day.predictions || []).forEach(pr => {
        arr.push({ jugador: pr.jugador, parsed: parseKoPred((pr.preds || [])[col]) });
      });
    });
  });
}

// Lista unificada para "Predicción Resultados": días de grupos (con fecha) + días
// eliminatorios derivados del fixture (28/06 en adelante), ordenados por fecha.
function buildPredResDays() {
  PRED_RES_DAYS = [];
  DAILY_DAYS.forEach(day => {
    if (day.date) PRED_RES_DAYS.push({ kind: 'group', iso: day.date, label: day.label, day });
  });
  const byDay = {};
  FIXTURE_ALL.forEach(m => {
    if (m.phase === 'grupos' || !m.date) return;
    const iso = m.date.split(' ')[0];
    (byDay[iso] = byDay[iso] || []).push(m);
  });
  Object.keys(byDay).forEach(iso => {
    const ms = byDay[iso].slice().sort((a, b) =>
      (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0));
    PRED_RES_DAYS.push({ kind: 'ko', iso, label: isoToLabel(iso), phaseLabel: ms[0].phase_label, matches: ms });
  });
  PRED_RES_DAYS.sort((a, b) => (a.iso || '').localeCompare(b.iso || ''));
}

// Vista clásica (grupos): conteo de resultados por partido.
function renderPredResGroup(el, day) {
  const partidos = (day.matches || []).slice(0, predResCount(day));
  const jugadores = day.predictions || [];
  if (!partidos.length) {
    el.insertAdjacentHTML('beforeend', emptyState('Sin partidos para este día.', '🗓️'));
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'pred-res-grid';

  partidos.forEach((nombre, idx) => {
    const counts = {};
    let total = 0;
    jugadores.forEach(j => {
      const v = (j.preds || [])[idx];
      if (v === null || v === undefined || v === '') return;
      counts[v] = (counts[v] || 0) + 1;
      total++;
    });
    const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const max = rows.length ? rows[0][1] : 0;

    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">${h(nombre)}</div>
      <div class="pred-card-sub">${total} predicción(es)</div>`;
    if (!rows.length) {
      html += `<div class="pred-empty">Sin predicciones</div>`;
    } else {
      html += rows.map(([res, cnt], i) => {
        const parts = String(res).split('|');
        const sign = parts[0] || '';
        const score = parts.length > 1 ? parts[1] : '';
        const signCls = sign === '1' ? 'sign-1' : sign === 'X' ? 'sign-X' : 'sign-2';
        const pct = max ? Math.round((cnt / max) * 100) : 0;
        return `<div class="pred-row clickable${i === 0 ? ' top' : ''}" data-mi="${idx}" data-res="${h(res)}" title="Ver quién eligió ${h(score)}">
          <span class="res-badge"><span class="res-sign ${signCls}">${h(sign)}</span>${h(score)}</span>
          <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
          <span class="res-count">${cnt}<span class="pred-chev">▾</span></span>
        </div>`;
      }).join('');
    }
    card.innerHTML = html;
    grid.appendChild(card);
  });

  el.appendChild(grid);

  // Al tocar un resultado, desplegar los jugadores que lo eligieron (acordeón por tarjeta)
  grid.addEventListener('click', e => {
    const row = e.target.closest('.pred-row.clickable');
    if (!row || !grid.contains(row)) return;
    const card = row.parentElement;
    const wasOpen = row.classList.contains('open');
    card.querySelectorAll('.pred-row.open').forEach(r => r.classList.remove('open'));
    card.querySelectorAll('.pred-names').forEach(n => n.remove());
    if (wasOpen) return;               // volver a tocar cierra el desplegable
    const mi = parseInt(row.dataset.mi, 10);
    const res = row.dataset.res;
    const names = jugadores.filter(j => (j.preds || [])[mi] === res).map(j => j.jugador);
    const panel = document.createElement('div');
    panel.className = 'pred-names';
    panel.innerHTML = names.length
      ? names.map(n => `<span class="pred-name-chip">${h(n)}</span>`).join('')
      : `<span class="pred-names-empty">Sin jugadores</span>`;
    row.classList.add('open');
    row.after(panel);
  });
}

// Tarjeta eliminatoria con acordeón: cada fila (data-row) despliega sus nombres.
function buildKoCard({ titleHtml, subHtml, chipsTitle, chips, rowsTitle, rows, emptyMsg }) {
  const card = document.createElement('div');
  card.className = 'pred-card';
  let html = `<div class="pred-card-head">${titleHtml}</div>`;
  if (subHtml) html += `<div class="pred-card-sub">${subHtml}</div>`;
  if (chipsTitle) {
    html += `<div class="ko-section">${h(chipsTitle)}</div>`;
    html += (chips && chips.length)
      ? `<div class="pred-names ko-static">${chips.map(n => `<span class="pred-name-chip">${h(n)}</span>`).join('')}</div>`
      : `<div class="pred-names ko-static"><span class="pred-names-empty">${h(emptyMsg || 'Nadie')}</span></div>`;
  }
  if (rowsTitle) html += `<div class="ko-section">${h(rowsTitle)}</div>`;
  if (!rows.length) {
    html += `<div class="pred-empty">${h(emptyMsg || 'Sin datos')}</div>`;
  } else {
    const max = rows[0].count;
    html += rows.map((r, i) => {
      const pct = max ? Math.round((r.count / max) * 100) : 0;
      const badge = (r.sign !== undefined) ? signBadge(r.sign) : '';
      return `<div class="pred-row clickable${i === 0 ? ' top' : ''}" data-row="${i}">
        <span class="res-badge">${badge}${h(r.label)}</span>
        <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
        <span class="res-count">${r.count}<span class="pred-chev">▾</span></span>
      </div>`;
    }).join('');
  }
  card.innerHTML = html;
  card.addEventListener('click', e => {
    const row = e.target.closest('.pred-row.clickable');
    if (!row || !card.contains(row)) return;
    const wasOpen = row.classList.contains('open');
    card.querySelectorAll('.pred-row.open').forEach(r => r.classList.remove('open'));
    card.querySelectorAll('.pred-names:not(.ko-static)').forEach(n => n.remove());
    if (wasOpen) return;
    const names = rows[parseInt(row.dataset.row, 10)].names || [];
    const panel = document.createElement('div');
    panel.className = 'pred-names';
    panel.innerHTML = names.length
      ? names.map(n => `<span class="pred-name-chip">${h(n)}</span>`).join('')
      : `<span class="pred-names-empty">Sin jugadores</span>`;
    row.classList.add('open');
    row.after(panel);
  });
  return card;
}

// Vista eliminatoria: validación de cruce + desglose / distribución por partido.
function renderPredResKo(el, entry) {
  const note = document.createElement('div');
  note.className = 'pred-res-note';
  note.innerHTML = `Cruces de <strong>${h(entry.phaseLabel)}</strong>. Cuando el cruce ya está
    confirmado se listan los jugadores que <strong>acertaron el enfrentamiento</strong> y, entre ellos,
    el desglose por resultado. Si el cruce aún no está definido, se muestra la distribución de cruces
    pronosticados. El cruce cuenta sin importar quién va de local o visitante.`;
  el.appendChild(note);

  const grid = document.createElement('div');
  grid.className = 'pred-res-grid';

  entry.matches.forEach(m => {
    const label = m.home + '-' + m.away;
    const validos = (KO_PRED_BY_MATCH[label] || []).filter(p => p.parsed && p.parsed.home && p.parsed.away);
    const total = validos.length;
    const titleHtml = `${h(m.home)} <span class="ko-vs">vs</span> ${h(m.away)}`;
    const confirmed = !isPlaceholderTeam(m.home) && !isPlaceholderTeam(m.away);
    const played = m.goal_home !== null && m.goal_away !== null;

    let card;
    if (confirmed) {
      // Quiénes acertaron el cruce (sin orden) y desglose por resultado entre ellos
      const wantKey = cruceKey(m.home, m.away);
      const aciertan = validos.filter(p => cruceKey(p.parsed.home, p.parsed.away) === wantKey);
      const byRes = {};
      aciertan.forEach(p => { (byRes[p.parsed.res] = byRes[p.parsed.res] || []).push(p.jugador); });
      const rows = Object.entries(byRes).map(([res, names]) => {
        const [sign, score] = res.split('|');
        return { sign, label: score || '—', count: names.length, names };
      }).sort((a, b) => b.count - a.count);
      const realTxt = played ? ` · Real: ${m.goal_home}-${m.goal_away}` : '';
      card = buildKoCard({
        titleHtml,
        subHtml: `<span class="ko-confirm">✓ Cruce confirmado</span> · ${aciertan.length}/${total} acertaron${realTxt}`,
        chipsTitle: 'Acertaron el cruce',
        chips: aciertan.map(p => p.jugador),
        rowsTitle: 'Desglose por resultado',
        rows,
        emptyMsg: 'Nadie acertó el cruce',
      });
    } else {
      // Cruce aún sin definir: distribución de los cruces pronosticados
      const byCruce = {};
      validos.forEach(p => {
        const key = cruceKey(p.parsed.home, p.parsed.away);
        (byCruce[key] = byCruce[key] || []).push(p.jugador);
      });
      const rows = Object.entries(byCruce).map(([key, names]) => ({
        label: key.split(' ∧ ').join(' vs '),
        count: names.length, names,
      })).sort((a, b) => b.count - a.count);
      card = buildKoCard({
        titleHtml,
        subHtml: `<span class="ko-pending">⏳ Cruce no confirmado</span> · ${total} pronóstico(s)`,
        rowsTitle: 'Distribución de cruces pronosticados',
        rows,
        emptyMsg: 'Sin pronósticos',
      });
    }
    grid.appendChild(card);
  });

  el.appendChild(grid);
}

    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'daily-scroll-wrap';
  const t = document.createElement('table');
  t.className = 'daily-clas-table';
  const matchCols = partidos.map(p => `<th style="min-width:130px">${h(p)}</th>`).join('');
  t.innerHTML = `<thead><tr>
    <th class="sticky-col" style="min-width:42px">Pos</th>
    <th class="sticky-col-2" style="text-align:left;min-width:140px">Jugador</th>
    <th style="min-width:76px">Pts día</th>
    ${matchCols}
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  jugadores.forEach(j => {
    const cells = (j.pts || []).map(v =>
      v === null ? `<td class="pred-null">—</td>` : `<td>${v}</td>`
    ).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="sticky-col">${posBadge(j.pos)}</td>
      <td class="left sticky-col-2"><span class="player-name">${h(j.jugador)}</span></td>
      <td class="pts-day">${j.puntos_dia}</td>
      ${cells}
    `;
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  el.appendChild(wrap);
  if (dailyClasFilter) filterPlayerRows(tbody, dailyClasFilter);
}

// ── DETALLE JUGADOR ────────────────────────────────────────────────────────────
// Para el jugador seleccionado muestra, partido a partido (solo los que ya tienen
// resultado cargado en data.json), el resultado real, el pronóstico del jugador y
// los puntos que sumó, con el total acumulado "hasta el momento" al final.

// Clasifica una columna de "equipo clasificado / honor" en su ronda. El orden
// importa: los rótulos largos ("Dieciseisavofinalista") contienen "finalista", así
// que las pruebas específicas deben evaluarse antes que /Finalista/.
function classifyQualCol(label) {
  const SEGS = [
    [/Dieciseisavofinalista/i, 'r32',    'Clasificados a 1/16 de Final',   1],
    [/Octavofinalista/i,       'r16',    'Clasificados a Octavos de Final', 2],
    [/Cuartofinalista/i,       'r8',     'Clasificados a Cuartos de Final', 3],
    [/Semifinalista/i,         'r4',     'Clasificados a Semifinales',      4],
    [/Finalista/i,             'rfinal', 'Clasificados a la Final',         5],
    [/puesto-\d/i,             'r34',    'Clasificados a 3er/4to puesto',   6],
    [/(Campe|Subcampe|puesto|Bota|Bal)/i, 'honor', 'Cuadro de Honor',      7],
  ];
  for (const [test, key, name, order] of SEGS) if (test.test(label)) return { key, name, order };
  return null;
}

// Construye los índices que usa esta vista a partir de los datos cargados.
function buildPlayerDetailIndex(data) {
  // Normaliza el nombre del jugador para cruzarlo entre bloques: la hoja CLAS a
  // veces trae espacios sobrantes (p. ej. "jaidali ") mientras que el bloque
  // diario viene recortado ("jaidali"), lo que rompería la unión por nombre.
  const norm = s => (s == null ? '' : String(s).trim());

  FIXTURE_ALL = data.fixture || [];
  FIXTURE_BY_NAME = {};
  FIXTURE_ALL.forEach(m => { FIXTURE_BY_NAME[m.home + '-' + m.away] = m; });

  CLAS_BY_NAME = {};
  (data.clas?.players || []).forEach(p => { CLAS_BY_NAME[norm(p.jugador)] = p; });

  // Para cada jugador, une su pronóstico (predictions) con sus puntos (clas) por
  // día, cruzando por nombre (predictions y clas vienen en orden distinto). De cada
  // columna se deriva, según su tipo:
  //   • PLAYER_MATCH_DATA  -> partidos reales del fixture (incluye cruces KO).
  //   • PLAYER_POS_DATA    -> posiciones de grupo ("1° GRUPO A").
  //   • PLAYER_QUAL_DATA   -> equipos clasificados por ronda + Cuadro de Honor.
  PLAYER_MATCH_DATA = {};
  PLAYER_POS_DATA = {};
  PLAYER_QUAL_DATA = {};
  (data.daily || []).forEach(day => {
    const ptsByPlayer = {};
    (day.clas || []).forEach(c => { ptsByPlayer[norm(c.jugador)] = c.pts || []; });
    (day.predictions || []).forEach(pr => {
      const key = norm(pr.jugador);
      const pts = ptsByPlayer[key] || [];
      const store = PLAYER_MATCH_DATA[key] || (PLAYER_MATCH_DATA[key] = {});
      let fsIdx = 0;   // contador de columnas de fase final (Finalista / 3-4 puesto) del día
      (day.matches || []).forEach((name, i) => {
        const pred = (pr.preds || [])[i] ?? null;
        const pt = pts[i] || 0;
        // 1) Partido real del fixture (grupos o cruce eliminatorio)
        if (name in FIXTURE_BY_NAME) {
          store[name] = { pred, pts: pt };
          return;
        }
        // 2) Posición de grupo: "1° GRUPO A" (solo en días con fecha 24–27/06)
        const mPos = /^(\d+)\D*GRUPO\s+([A-L])/i.exec(name);
        if (mPos) {
          const grp = mPos[2].toUpperCase();
          const byGrp = PLAYER_POS_DATA[key] || (PLAYER_POS_DATA[key] = {});
          (byGrp[grp] = byGrp[grp] || []).push({ pos: +mPos[1], predTeam: pred, pts: pt });
          return;
        }
        // 3) Equipo clasificado / Cuadro de Honor (columnas de fase sin fecha)
        if (!day.date && pred && String(pred).indexOf('·') < 0) {
          let seg = classifyQualCol(name);
          if (!seg) return;
          // La fase final viene mal rotulada en el Excel (aparece "Finalista-2" donde
          // debería decir "3-4 puesto-2"). Las 4 columnas de fase final del día de
          // Semifinales se reparten por posición: las 2 primeras al 3er/4to puesto y
          // las 2 siguientes a la Final (estructura real: 2 + 2, no 3 + 1).
          if (seg.key === 'rfinal' || seg.key === 'r34') {
            seg = (fsIdx < 2)
              ? { key: 'r34',    name: 'Clasificados a 3er/4to puesto', order: 6 }
              : { key: 'rfinal', name: 'Clasificados a la Final',       order: 5 };
            fsIdx++;
          }
          const bySeg = PLAYER_QUAL_DATA[key] || (PLAYER_QUAL_DATA[key] = {});
          const bucket = bySeg[seg.key] || (bySeg[seg.key] = { name: seg.name, order: seg.order, items: [] });
          bucket.items.push({ label: name, predTeam: pred, pts: pt });
        }
      });
    });
  });

  ALL_PLAYERS = (data.clas?.players || [])
    .map(p => norm(p.jugador))
    .sort((a, b) => a.localeCompare(b, 'es'));
  // Conservar selección previa si sigue existiendo; si no, el primero.
  if (!ALL_PLAYERS.includes(playerDetailSel)) playerDetailSel = ALL_PLAYERS[0] || '';
}

function signFromGoals(gh, ga) { return gh > ga ? '1' : gh < ga ? '2' : 'X'; }

function signBadge(sign) {
  const cls = sign === '1' ? 'sign-1' : sign === 'X' ? 'sign-X' : 'sign-2';
  return `<span class="res-sign ${cls}">${h(sign)}</span>`;
}

function renderPlayerDetail() {
  const el = document.getElementById('player-detail-content');
  el.innerHTML = '';
  if (!ALL_PLAYERS.length) { el.innerHTML = emptyState('Sin datos disponibles.'); return; }

  // Cabecera con selector de jugador
  const header = document.createElement('div');
  header.className = 'daily-header';
  header.innerHTML = `Selecciona jugador:&nbsp;`;
  const sel = document.createElement('select');
  sel.className = 'day-select';
  ALL_PLAYERS.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === playerDetailSel) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => { playerDetailSel = e.target.value; renderPlayerDetail(); });
  header.appendChild(sel);
  el.appendChild(header);

  // Control segmentado: 3 vistas del jugador seleccionado
  const views = [
    ['partidos',     '⚽ Detalle Partidos'],
    ['posiciones',   '📊 Posición Grupos'],
    ['clasificados', '🏅 Equipos Clasificados'],
    ['honor',        '🏆 Cuadro de Honor'],
  ];
  const seg = document.createElement('div');
  seg.className = 'pd-views';
  views.forEach(([key, label]) => {
    const b = document.createElement('button');
    b.className = 'pd-view-btn' + (playerDetailView === key ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', () => { playerDetailView = key; renderPlayerDetail(); });
    seg.appendChild(b);
  });
  el.appendChild(seg);

  const body = document.createElement('div');
  el.appendChild(body);
  if (playerDetailView === 'posiciones')        renderPDPositions(body, playerDetailSel);
  else if (playerDetailView === 'clasificados') renderPDQualified(body, playerDetailSel);
  else if (playerDetailView === 'honor')        renderPDHonor(body, playerDetailSel);
  else                                          renderPDMatches(body, playerDetailSel);
}

// Extrae {sign, score} de un pronóstico, sea de grupos ("1|2-0") o KO ("Cruce·1|2-0").
function predSignScore(pred) {
  if (pred == null) return null;
  if (String(pred).indexOf('·') >= 0) {
    const p = parseKoPred(pred);
    return p ? { sign: p.sign, score: p.score } : null;
  }
  const parts = String(pred).split('|');
  return parts.length > 1 ? { sign: parts[0], score: parts.slice(1).join('|') } : { sign: '', score: parts[0] };
}

// ¿El jugador acertó el cruce (sin orden) de un partido eliminatorio?
function playerHasCruce(store, m) {
  const d = store[m.home + '-' + m.away];
  if (!d || !d.pred) return false;
  const p = parseKoPred(d.pred);
  return !!(p && p.home && p.away && cruceKey(p.home, p.away) === cruceKey(m.home, m.away));
}

// ── Vista 1: Detalle Partidos (grupos jugados + cruces KO confirmados) ──────────
function renderPDMatches(el, player) {
  const store = PLAYER_MATCH_DATA[player] || {};

  // Partidos jugados: grupos siempre; eliminatorios solo si acertó el cruce.
  const played = FIXTURE_ALL.filter(m =>
    m.goal_home !== null && m.goal_away !== null &&
    (m.phase === 'grupos' || playerHasCruce(store, m)))
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0));

  // Cruces eliminatorios confirmados, aún sin jugar, donde acertó el cruce.
  const pendKo = FIXTURE_ALL.filter(m =>
    m.phase !== 'grupos' && m.goal_home === null &&
    !isPlaceholderTeam(m.home) && !isPlaceholderTeam(m.away) &&
    playerHasCruce(store, m))
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0));

  let total = 0, conPuntos = 0, exactos = 0;
  played.forEach(m => {
    const d = store[m.home + '-' + m.away];
    const pts = d ? d.pts : 0;
    total += pts;
    if (pts > 0) conPuntos++;
    const ss = d && d.pred ? predSignScore(d.pred) : null;
    if (ss && ss.score === `${m.goal_home}-${m.goal_away}`) exactos++;
  });

  const clasInfo = CLAS_BY_NAME[player] || {};

  const summary = document.createElement('div');
  summary.className = 'pd-summary';
  summary.innerHTML = `
    <div class="pd-stat"><div class="pd-stat-val green">${total}</div><div class="pd-stat-lbl">Puntos (partidos)</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${clasInfo.pos ? '#' + clasInfo.pos : '—'}</div><div class="pd-stat-lbl">Posición general</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${played.length}</div><div class="pd-stat-lbl">Partidos jugados</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${conPuntos}</div><div class="pd-stat-lbl">Con puntos</div></div>
    <div class="pd-stat"><div class="pd-stat-val">${exactos}</div><div class="pd-stat-lbl">Marcador exacto</div></div>`;
  el.appendChild(summary);

  // Tabla de partidos jugados
  if (played.length) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const t = document.createElement('table');
    t.className = 'fixture-table pd-table';
    t.innerHTML = `<thead><tr>
      <th>Fecha (UTC-4)</th><th class="left">Partido</th>
      <th>Resultado Real</th><th>Tu Pronóstico</th><th>Puntos</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    played.forEach(m => {
      const d = store[m.home + '-' + m.away];
      const pts = d ? d.pts : 0;
      const realScore = `${m.goal_home}-${m.goal_away}`;
      const realSign = signFromGoals(m.goal_home, m.goal_away);
      const ss = d && d.pred ? predSignScore(d.pred) : null;
      const predHtml = ss
        ? `<span class="score-pred">${ss.sign ? signBadge(ss.sign) : ''}${h(ss.score)}</span>`
        : `<span class="pred-null">Sin pronóstico</span>`;
      const tr = document.createElement('tr');
      if (pts > 0) tr.classList.add('hit');
      tr.innerHTML = `
        <td style="white-space:nowrap;font-size:.75rem">${fmtDate(m.date)}</td>
        <td class="team left">${h(m.home)} <span style="color:var(--muted);font-weight:400">vs</span> ${h(m.away)}</td>
        <td class="score"><span class="score-real">${signBadge(realSign)}${realScore}</span></td>
        <td class="score">${predHtml}</td>
        <td class="pd-pts ${pts > 0 ? 'pos' : 'zero'}">${pts}</td>`;
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    const tfoot = document.createElement('tfoot');
    tfoot.innerHTML = `<tr><td colspan="4" class="left">TOTAL hasta el momento</td><td class="pd-total-val">${total}</td></tr>`;
    t.appendChild(tfoot);
    wrap.appendChild(t);
    el.appendChild(wrap);
  } else {
    el.insertAdjacentHTML('beforeend', emptyState('Aún no hay partidos con resultado cargado.', '🗓️'));
  }

  // Cruces eliminatorios confirmados, pendientes de jugarse (solo quienes acertaron el cruce)
  if (pendKo.length) {
    el.insertAdjacentHTML('beforeend',
      `<div class="ko-section" style="border-top:none">Cruces eliminatorios confirmados (pendientes)</div>
       <div class="pd-note">Estos cruces ya están confirmados y tú acertaste el enfrentamiento. Los puntos del resultado se cargarán cuando se juegue el partido.</div>`);
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const t = document.createElement('table');
    t.className = 'fixture-table pd-table';
    t.innerHTML = `<thead><tr>
      <th>Fecha (UTC-4)</th><th class="left">Partido</th><th>Fase</th>
      <th>Tu Pronóstico</th><th>Puntos</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    pendKo.forEach(m => {
      const d = store[m.home + '-' + m.away];
      const ss = d && d.pred ? predSignScore(d.pred) : null;
      const predHtml = ss
        ? `<span class="score-pred">${ss.sign ? signBadge(ss.sign) : ''}${h(ss.score)}</span>`
        : `<span class="pred-null">—</span>`;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="white-space:nowrap;font-size:.75rem">${fmtDate(m.date)}</td>
        <td class="team left">${h(m.home)} <span style="color:var(--muted);font-weight:400">vs</span> ${h(m.away)}</td>
        <td style="font-size:.72rem;color:var(--muted)">${h(m.phase_label)}</td>
        <td class="score">${predHtml}</td>
        <td class="pd-pts zero">⏳</td>`;
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    el.appendChild(wrap);
  }
}

// ── Vista 2: Posición Grupos (pronóstico vs real, por grupo) ────────────────────
function renderPDPositions(el, player) {
  const byGrp = PLAYER_POS_DATA[player] || {};
  const groups = Object.keys(byGrp).sort();
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Posición que pronosticaste en cada grupo vs. la posición real del fixture. Verde = acertaste esa posición.</div>`);
  if (!groups.length) { el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronóstico de posiciones de grupo.', '📊')); return; }

  let totalPts = 0;
  groups.forEach(g => (byGrp[g] || []).forEach(p => totalPts += (p.pts || 0)));
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-summary"><div class="pd-stat"><div class="pd-stat-val green">${totalPts}</div><div class="pd-stat-lbl">Puntos posición grupos</div></div></div>`);

  const grid = document.createElement('div');
  grid.className = 'pd-grid';
  groups.forEach(g => {
    const preds = (byGrp[g] || []).slice().sort((a, b) => a.pos - b.pos);
    const real = GROUPS_BY_NAME['Grupo ' + g] || [];
    const sub = preds.reduce((s, p) => s + (p.pts || 0), 0);
    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">Grupo ${h(g)}</div>
      <div class="pred-card-sub">${sub} pts</div>
      <table class="pos-table"><thead><tr><th>#</th><th>Tu pronóstico</th><th>Real</th><th></th></tr></thead><tbody>`;
    preds.forEach(p => {
      const realTeam = real[p.pos - 1] ? real[p.pos - 1].team : '—';
      const hit = (p.pts || 0) > 0;
      html += `<tr class="${hit ? 'hit' : ''}">
        <td class="pos-n">${p.pos}°</td>
        <td class="pos-pred">${h(p.predTeam || '—')}</td>
        <td class="pos-real">${h(realTeam)}</td>
        <td class="pos-pts">${p.pts || 0}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    card.innerHTML = html;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// ── Vista 3: Equipos Clasificados por ronda (el Cuadro de Honor va en su vista) ──
function renderPDQualified(el, player) {
  const bySeg = PLAYER_QUAL_DATA[player] || {};
  const segs = Object.values(bySeg).filter(s => s.key !== 'honor').sort((a, b) => a.order - b.order);
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Equipos que pronosticaste por ronda. Sumas si el equipo llega a esa ronda, sin importar la llave que pusiste. Verde = ya clasificó y sumó.</div>`);
  if (!segs.length) { el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronóstico de equipos clasificados.', '🏅')); return; }

  let grandTotal = 0;
  segs.forEach(s => s.items.forEach(it => grandTotal += (it.pts || 0)));
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-summary"><div class="pd-stat"><div class="pd-stat-val green">${grandTotal}</div><div class="pd-stat-lbl">Puntos equipos clasificados</div></div></div>`);

  const grid = document.createElement('div');
  grid.className = 'pd-grid';
  segs.forEach(s => {
    const sub = s.items.reduce((a, it) => a + (it.pts || 0), 0);
    const hits = s.items.filter(it => (it.pts || 0) > 0).length;
    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">${h(s.name)}</div>
      <div class="pred-card-sub">${hits}/${s.items.length} aciertos · ${sub} pts</div>`;
    // Final y 3er/4to puesto -> filas rol→equipo (rótulos heterogéneos).
    // Rondas de avance (1/16…semis) -> chips de equipos.
    const ROLE_SEGS = { rfinal: 1, r34: 1 };
    if (ROLE_SEGS[s.key]) {
      s.items.forEach(it => {
        const hit = (it.pts || 0) > 0;
        html += `<div class="qual-role ${hit ? 'hit' : ''}">
          <span class="qr-lbl">${h(honorLabel(it.label))}</span>
          <span class="qr-team">${h(it.predTeam || '—')}</span>
          <span class="qr-pts">${it.pts || 0}</span>
        </div>`;
      });
    } else {
      html += `<div class="qual-grid">` + s.items.map(it => {
        const hit = (it.pts || 0) > 0;
        return `<span class="qual-chip ${hit ? 'hit' : 'miss'}">${h(it.predTeam || '—')}${hit ? `<span class="qp">+${it.pts}</span>` : ''}</span>`;
      }).join('') + `</div>`;
    }
    card.innerHTML = html;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// ── Vista 4: Cuadro de Honor (podio + botas + balones) ──────────────────────────
function renderPDHonor(el, player) {
  const seg = (PLAYER_QUAL_DATA[player] || {}).honor;
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-note">Podio final y premios individuales. Verde = acertado. Los puntos se cargan cuando se define cada premio.</div>`);
  if (!seg || !seg.items.length) { el.insertAdjacentHTML('beforeend', emptyState('Este jugador no tiene pronóstico de Cuadro de Honor.', '🏆')); return; }

  const total = seg.items.reduce((a, it) => a + (it.pts || 0), 0);
  el.insertAdjacentHTML('beforeend',
    `<div class="pd-summary"><div class="pd-stat"><div class="pd-stat-val green">${total}</div><div class="pd-stat-lbl">Puntos Cuadro de Honor</div></div></div>`);

  // Agrupa en Podio / Bota de Oro / Balón de Oro (como las cards de Posición Grupos)
  const buckets = [
    { name: '🏆 Podio final',  test: it => !/Bota|Bal[oó]n/i.test(it.label), items: [] },
    { name: '👟 Bota de Oro',  test: it => /Bota/i.test(it.label),          items: [] },
    { name: '⚽ Balón de Oro', test: it => /Bal[oó]n/i.test(it.label),       items: [] },
  ];
  seg.items.forEach(it => { (buckets.find(b => b.test(it)) || buckets[0]).items.push(it); });

  const grid = document.createElement('div');
  grid.className = 'pd-grid';
  buckets.forEach(b => {
    if (!b.items.length) return;
    const sub = b.items.reduce((a, it) => a + (it.pts || 0), 0);
    const card = document.createElement('div');
    card.className = 'pred-card';
    let html = `<div class="pred-card-head">${h(b.name)}</div><div class="pred-card-sub">${sub} pts</div>`;
    b.items.forEach(it => {
      const hit = (it.pts || 0) > 0;
      html += `<div class="qual-role ${hit ? 'hit' : ''}">
        <span class="qr-lbl">${h(honorLabel(it.label))}</span>
        <span class="qr-team">${h(it.predTeam || '—')}</span>
        <span class="qr-pts">${it.pts || 0}</span>
      </div>`;
    });
    card.innerHTML = html;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// Limpia el rótulo de una columna del Cuadro de Honor (quita emojis y sufijos "-N").
function honorLabel(label) {
  return String(label)
    .replace(/^[^0-9A-Za-zÁÉÍÓÚÑáéíóúñ]+/, '')
    .replace(/-\d+$/, '')
    .trim();
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    document.getElementById('page-title').textContent = data.clas?.title || 'Quiniela Mundial 2026';
    document.getElementById('updated-at').textContent = 'Actualizado: ' + (data.updated_at || '');
    document.getElementById('loading').style.display = 'none';

    DAILY_DAYS = data.daily || [];
    FIXTURE_DAYS = buildFixtureDays(data.fixture || []);

    // Tablas de posiciones: usar las del Excel (data.groups) si existen; si no,
    // calcularlas al vuelo desde los resultados del fixture (siempre actuales).
    GROUPS_BY_NAME = {};
    if (Array.isArray(data.groups) && data.groups.length) {
      data.groups.forEach(g => { GROUPS_BY_NAME[g.name] = g.teams || []; });
    } else {
      GROUPS_BY_NAME = computeGroupStandings(data.fixture || []);
    }
    // Índices que dependen del fixture: detalle jugador y cruces eliminatorios.
    // Deben construirse antes de elegir el día por defecto y de renderizar.
    buildPlayerDetailIndex(data);   // define FIXTURE_ALL / FIXTURE_BY_NAME
    buildKnockoutIndex(data);       // define KO_PRED_BY_MATCH (usa FIXTURE_BY_NAME)
    buildPredResDays();             // une días de grupos + eliminatorias (usa FIXTURE_ALL)

    // Default the selectors to today's day if it exists, else the first day.
    const todayIso = venezuelaTodayIso();
    const todayIdx = DAILY_DAYS.findIndex(d => d.date === todayIso);
    dailyPredIdx = dailyClasIdx = (todayIdx >= 0 ? todayIdx : 0);
    const todayPrIdx = PRED_RES_DAYS.findIndex(d => d.iso === todayIso);
    predResIdx = (todayPrIdx >= 0 ? todayPrIdx : 0);
    const todayFixIdx = FIXTURE_DAYS.findIndex(d => d.iso === todayIso);
    partidosDiaIdx = (todayFixIdx >= 0 ? todayFixIdx : 0);

    renderClas(data);
    setupClasSearch();
    renderPlayerDetail();
    renderFixture(data.fixture || []);
    renderPartidosDia();
    renderDailyPred();
    renderPredResultados();
    renderDailyClas();

    const n = (data.clas?.players || []).length;
    document.getElementById('footer').textContent =
      `${n} participantes · ${data.fixture?.length || 0} partidos · ${data.updated_at}`;

  } catch (e) {
    document.getElementById('loading').textContent = 'Error al cargar datos: ' + e.message;
  }
}

load();
</script>
</body>
</html>
