<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiniela Mundial 2026</title>
  <style>
    :root {
      --navy:   #1a2e5a;
      --navy2:  #0f1e3d;
      --gold:   #f5c518;
      --gold2:  #e0a800;
      --green:  #006d3b;
      --green2: #005530;
      --light:  #f0f4ff;
      --stripe: #dce7ff;
      --border: #b0bfd8;
      --text:   #1a1a2e;
      --muted:  #6b7a99;
      --white:  #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0d1b3e 0%, #1a3a6e 50%, #0d1b3e 100%);
      min-height: 100vh;
      padding: 20px 10px 40px;
      color: var(--text);
    }

    .wrapper { max-width: 1440px; margin: 0 auto; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 {
      color: var(--gold);
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .header .subtitle { color: #a0b8e8; font-size: .82rem; margin-top: 5px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 0;
      padding: 0 4px;
    }
    .tab-btn {
      padding: 9px 16px;
      border: none;
      border-radius: 8px 8px 0 0;
      background: rgba(255,255,255,.12);
      color: #c0d4ff;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .tab-btn:hover  { background: rgba(255,255,255,.22); color: #fff; }
    .tab-btn.active { background: #fff; color: var(--navy); }

    /* ── Card ── */
    .card {
      background: var(--white);
      border-radius: 0 8px 8px 8px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.45);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .table-wrap { overflow-x: auto; }

    /* ── Base table ── */
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #e2e8f4; border-right: 1px solid #e2e8f4; }
    tbody tr:nth-child(odd)  { background: var(--white); }
    tbody tr:nth-child(even) { background: var(--stripe); }
    tbody tr:hover           { background: #c8d8ff; }
    td { text-align: center; }
    td.left, th.left { text-align: left; }

    /* ── CLAS table ── */
    thead tr.maxrow th {
      background: #e8edf8; color: var(--muted);
      font-size: .68rem; font-weight: 600; padding: 3px 8px;
      border-bottom: 1px solid var(--border); text-align: center;
      white-space: nowrap;
    }
    thead tr.colrow th {
      background: var(--navy); color: var(--white);
      font-weight: 700; padding: 9px 8px;
      white-space: nowrap; text-align: center;
      border-right: 1px solid rgba(255,255,255,.08); font-size: .73rem;
    }
    thead tr.colrow th.pts-col { background: var(--green); min-width: 76px; }

    .pos-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      font-weight: 700; font-size: .75rem;
    }
    .pos-1     { background: var(--gold); color: #333; }
    .pos-2     { background: #c0c0c0;     color: #333; }
    .pos-3     { background: #cd7f32;     color: #fff; }
    .pos-other { background: #e2e8f4;     color: var(--text); }
    .player-name { font-weight: 600; color: var(--navy); }
    td.pts-cell { font-weight: 800; font-size: .93rem; color: var(--green); }

    .bar-wrap { display: flex; align-items: center; gap: 4px; }
    .bar-outer { flex: 1; height: 5px; background: #dde4f0; border-radius: 3px; min-width: 36px; }
    .bar-inner { height: 100%; border-radius: 3px; background: linear-gradient(90deg,#3a7bd5,#00c6ff); }
    .bar-val   { min-width: 16px; text-align: right; font-size: .76rem; }

    /* ── FIXTURE ── */
    .phase-header {
      background: var(--navy2);
      color: var(--gold);
      font-weight: 700;
      font-size: .82rem;
      padding: 8px 14px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .group-header {
      background: #2e4a8a;
      color: #cde;
      font-weight: 600;
      font-size: .76rem;
      padding: 5px 14px;
      letter-spacing: .02em;
    }
    .fixture-table th {
      background: var(--navy);
      color: var(--white);
      font-size: .73rem;
      font-weight: 600;
      padding: 7px 8px;
      white-space: nowrap;
      text-align: center;
    }
    .fixture-table td { font-size: .8rem; }
    .fixture-table td.team { font-weight: 600; color: var(--navy); }
    .score-cell { font-weight: 800; font-size: .95rem; color: var(--green); }
    .score-cell.pending { color: var(--muted); font-weight: 400; font-size: .8rem; }

    /* ── DAILY PREDICTION ── */
    .daily-header {
      padding: 14px 18px;
      background: var(--navy);
      color: var(--white);
      font-size: .88rem;
    }
    .daily-header strong { color: var(--gold); }
    .daily-table th {
      background: var(--navy);
      color: var(--white);
      font-size: .73rem;
      padding: 8px;
      white-space: nowrap;
      text-align: center;
    }
    .daily-table th.left { text-align: left; }
    .pred-cell { font-size: .82rem; }
    .pred-null { color: #bbb; font-size: .75rem; }

    /* ── DAILY CLAS ── */
    .daily-clas-table th {
      background: var(--green);
      color: var(--white);
      font-size: .73rem;
      padding: 8px;
      white-space: nowrap;
      text-align: center;
    }
    .daily-clas-table th.left { text-align: left; }
    .pts-day { font-weight: 800; color: var(--green); }

    /* ── STATS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 20px;
    }
    .stat-card {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-card .s-label { font-size: .75rem; color: var(--muted); margin-bottom: 5px; }
    .stat-card .s-val   { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
    .stat-card .s-pct   { font-size: .75rem; color: var(--green); margin-top: 3px; }
    .stat-pbar { height: 5px; background: #dde4f0; border-radius: 3px; margin-top: 8px; }
    .stat-pbar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg,#3a7bd5,#00c6ff); }

    /* ── Footer ── */
    .footer {
      text-align: center; color: #7090c0; font-size: .7rem;
      padding: 10px 16px; border-top: 1px solid var(--border); background: #f7f9ff;
    }

    #loading { text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1 id="page-title">Quiniela Mundial 2026</h1>
    <p class="subtitle" id="updated-at"></p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="clas">🏆 Clasificación</button>
    <button class="tab-btn" data-tab="fixture">📅 Fixture</button>
    <button class="tab-btn" data-tab="daily-pred">⚽ Predicción del Día</button>
    <button class="tab-btn" data-tab="daily-clas">📊 Clas. del Día</button>
    <button class="tab-btn" data-tab="stats">📈 Estadísticas</button>
  </div>

  <div class="card">
    <div id="loading">Cargando datos…</div>

    <!-- CLASIFICACIÓN -->
    <div class="tab-panel active" id="tab-clas">
      <div class="table-wrap">
        <table id="clas-table">
          <thead>
            <tr class="maxrow" id="max-row"></tr>
            <tr class="colrow" id="col-row"></tr>
          </thead>
          <tbody id="clas-body"></tbody>
        </table>
      </div>
    </div>

    <!-- FIXTURE -->
    <div class="tab-panel" id="tab-fixture">
      <div id="fixture-content"></div>
    </div>

    <!-- DAILY PREDICTION -->
    <div class="tab-panel" id="tab-daily-pred">
      <div id="daily-pred-content"></div>
    </div>

    <!-- DAILY CLAS -->
    <div class="tab-panel" id="tab-daily-clas">
      <div id="daily-clas-content"></div>
    </div>

    <!-- STATS -->
    <div class="tab-panel" id="tab-stats">
      <div id="stats-content"></div>
    </div>

    <div class="footer" id="footer"></div>
  </div>
</div>

<script>
// ── Tab logic ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Helpers ──────────────────────────────────────────────────────────────────
const h = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

function posBadge(pos) {
  const cls = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-other';
  return `<span class="pos-badge ${cls}">${pos}</span>`;
}

function barCell(val, max) {
  if (!max) return `<span>${val}</span>`;
  const pct = Math.min(100, Math.round((val / max) * 100));
  return `<div class="bar-wrap">
    <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
    <span class="bar-val">${val}</span>
  </div>`;
}

function fmtDate(str) {
  if (!str) return '—';
  // str like "2026-06-11 15:00"
  const [date, time] = str.split(' ');
  const [y, m, d] = date.split('-');
  return `${d}/${m} ${time || ''}`.trim();
}

// ── CLAS ─────────────────────────────────────────────────────────────────────
const SCORE_COLS = ['f_grupos','pos_grupos','eq_16','pt_16','eq_8','pt_8','eq_4','pt_4','eq_2','pt_2','eq_34','eq_final','pt_34','pt_final','honor'];

function renderClas(data) {
  const maxValues = data.max_values || {};
  const cols = data.columns || [];
  const maxRow = document.getElementById('max-row');
  const colRow = document.getElementById('col-row');

  cols.forEach(([key]) => {
    const th1 = document.createElement('th');
    th1.textContent = maxValues[key] ? 'Máx: ' + maxValues[key] : '';
    if (key === 'pos' || key === 'jugador') th1.className = 'left';
    maxRow.appendChild(th1);

    const th2 = document.createElement('th');
    const label = cols.find(c => c[0] === key)?.[1] || key;
    th2.textContent = label;
    if (key === 'pos')     th2.className = 'left';
    if (key === 'jugador') th2.className = 'left';
    if (key === 'puntos')  th2.className = 'pts-col';
    colRow.appendChild(th2);
  });

  const tbody = document.getElementById('clas-body');
  (data.clas?.players || data.players || []).forEach(p => {
    const tr = document.createElement('tr');
    cols.forEach(([key]) => {
      const td = document.createElement('td');
      if (key === 'pos') {
        td.innerHTML = posBadge(p.pos);
      } else if (key === 'jugador') {
        td.className = 'left';
        td.innerHTML = `<span class="player-name">${h(p.jugador)}</span>`;
      } else if (key === 'puntos') {
        td.className = 'pts-cell';
        td.textContent = p.puntos;
      } else if (SCORE_COLS.includes(key)) {
        td.innerHTML = barCell(p[key] || 0, maxValues[key] || 0);
      } else {
        td.textContent = p[key] ?? 0;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// ── FIXTURE ───────────────────────────────────────────────────────────────────
function renderFixture(matches) {
  const el = document.getElementById('fixture-content');

  // Group by phase, then by group
  const PHASE_ORDER = ['grupos','dieciseisavos','octavos','cuartos','semis','tercero','final'];
  const byPhase = {};
  matches.forEach(m => {
    (byPhase[m.phase] = byPhase[m.phase] || []).push(m);
  });

  PHASE_ORDER.forEach(phase => {
    const list = byPhase[phase];
    if (!list || !list.length) return;

    const phDiv = document.createElement('div');
    phDiv.innerHTML = `<div class="phase-header">${h(list[0].phase_label)}</div>`;

    if (phase === 'grupos') {
      // sub-group
      const byGroup = {};
      list.forEach(m => (byGroup[m.group || ''] = byGroup[m.group || ''] || []).push(m));
      Object.entries(byGroup).sort(([a],[b]) => a.localeCompare(b)).forEach(([grp, ms]) => {
        phDiv.innerHTML += `<div class="group-header">${h(grp)}</div>`;
        phDiv.appendChild(buildMatchTable(ms));
      });
    } else {
      phDiv.appendChild(buildMatchTable(list));
    }

    el.appendChild(phDiv);
  });
}

function buildMatchTable(matches) {
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const t = document.createElement('table');
  t.className = 'fixture-table';
  t.innerHTML = `<thead><tr>
    <th>#</th><th>Fecha (UTC-4)</th><th class="left">Local</th>
    <th>Resultado</th><th class="left">Visitante</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  matches.forEach(m => {
    const played = m.goal_home !== null && m.goal_away !== null;
    const score = played
      ? `<span class="score-cell">${m.goal_home} - ${m.goal_away}</span>`
      : `<span class="score-cell pending">vs</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:var(--muted);font-size:.75rem">${m.num || ''}</td>
      <td style="white-space:nowrap;font-size:.75rem">${fmtDate(m.date)}</td>
      <td class="team left">${h(m.home)}</td>
      <td>${score}</td>
      <td class="team left">${h(m.away)}</td>
    `;
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

// ── DAILY PREDICTION ─────────────────────────────────────────────────────────
function renderDailyPred(dp) {
  const el = document.getElementById('daily-pred-content');
  const fecha = dp.fecha || '—';
  const partidos = dp.partidos || [];
  const jugadores = dp.jugadores || [];

  el.innerHTML = `<div class="daily-header">
    Predicciones del día: <strong>${h(fecha)}</strong>
    &nbsp;·&nbsp; ${partidos.length} partido(s)
  </div>`;

  if (!partidos.length) {
    el.innerHTML += '<p style="padding:20px;color:var(--muted)">Sin partidos para este día.</p>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const t = document.createElement('table');
  t.className = 'daily-table';
  const headerCells = partidos.map(p => `<th title="${h(p)}">${h(p.length > 20 ? p.slice(0,18)+'…' : p)}</th>`).join('');
  t.innerHTML = `<thead><tr><th class="left">Jugador</th>${headerCells}</tr></thead>`;
  const tbody = document.createElement('tbody');
  jugadores.forEach(j => {
    const cells = j.predicciones.map(v =>
      v === null
        ? `<td class="pred-null">—</td>`
        : `<td class="pred-cell">${h(v)}</td>`
    ).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="left"><span class="player-name">${h(j.jugador)}</span></td>${cells}`;
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  el.appendChild(wrap);
}

// ── DAILY CLAS ────────────────────────────────────────────────────────────────
function renderDailyClas(dc) {
  const el = document.getElementById('daily-clas-content');
  const fecha = dc.fecha || '—';
  const partidos = dc.partidos || [];
  const jugadores = dc.jugadores || [];

  el.innerHTML = `<div class="daily-header">
    Clasificación del día: <strong>${h(fecha)}</strong>
    &nbsp;·&nbsp; ${partidos.length} partido(s)
  </div>`;

  if (!jugadores.length) {
    el.innerHTML += '<p style="padding:20px;color:var(--muted)">Sin datos.</p>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const t = document.createElement('table');
  t.className = 'daily-clas-table';
  const matchCols = partidos.map(p => `<th title="${h(p)}">${h(p.length > 20 ? p.slice(0,18)+'…' : p)}</th>`).join('');
  t.innerHTML = `<thead><tr>
    <th>Pos</th><th class="left">Jugador</th><th>Pts día</th>${matchCols}
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  jugadores.forEach(j => {
    const cells = (j.puntos_partidos || []).map(v =>
      v === null ? `<td class="pred-null">—</td>` : `<td>${v}</td>`
    ).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${posBadge(j.pos)}</td>
      <td class="left"><span class="player-name">${h(j.jugador)}</span></td>
      <td class="pts-day">${j.puntos_dia}</td>
      ${cells}
    `;
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  el.appendChild(wrap);
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats(stats) {
  const el = document.getElementById('stats-content');
  const fecha = stats.fecha || '—';
  el.innerHTML = `<div class="daily-header">
    Estadísticas del día: <strong>${h(fecha)}</strong>
  </div>`;

  const grid = document.createElement('div');
  grid.className = 'stats-grid';

  (stats.stats || []).forEach(s => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    const pct = typeof s.pct === 'number' ? s.pct : 0;
    card.innerHTML = `
      <div class="s-label">${h(s.label)}</div>
      <div class="s-val">${typeof s.value === 'number' ? s.value.toLocaleString('es') : h(String(s.value))}</div>
      ${pct > 0 ? `<div class="s-pct">${pct}% del total</div>` : ''}
      <div class="stat-pbar"><div class="stat-pbar-fill" style="width:${Math.min(pct,100)}%"></div></div>
    `;
    grid.appendChild(card);
  });

  el.appendChild(grid);
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    document.getElementById('page-title').textContent = data.clas?.title || 'Quiniela Mundial 2026';
    document.getElementById('updated-at').textContent = 'Actualizado: ' + (data.updated_at || '');
    document.getElementById('loading').style.display = 'none';

    renderClas(data);
    renderFixture(data.fixture || []);
    renderDailyPred(data.daily_pred || {});
    renderDailyClas(data.daily_clas || {});
    renderStats(data.stats || {});

    const n = (data.clas?.players || []).length;
    document.getElementById('footer').textContent =
      `${n} participantes · ${data.fixture?.length || 0} partidos · ${data.updated_at}`;

  } catch (e) {
    document.getElementById('loading').textContent = 'Error al cargar datos: ' + e.message;
  }
}

load();
</script>
</body>
</html>
