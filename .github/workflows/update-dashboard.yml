name: Update Dashboard

on:
  push:
    branches: [main]
    paths:
      - "ADMINExcelMundial2026*.xlsx"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      # LibreOffice se cachea como paquetes .deb para no descargar ~94 MB en cada
      # corrida (esa descarga desde el mirror de apt es lo que se colgaba/tardaba).
      # En un cache-hit la instalación baja de ~10 min a segundos. El paquete y el
      # recálculo son idénticos, así que los puntos salen exactamente igual.
      - name: Cache LibreOffice packages
        uses: actions/cache@v4
        with:
          path: ~/lo-apt-debs
          key: lo-apt-debs-${{ runner.os }}-libreoffice-calc-v1

      - name: Install LibreOffice Calc
        run: |
          set -e
          mkdir -p ~/lo-apt-debs/partial
          if ls ~/lo-apt-debs/*.deb >/dev/null 2>&1; then
            echo "Cache hit — instalando LibreOffice desde .deb cacheados (sin descarga)."
            sudo dpkg -i ~/lo-apt-debs/*.deb || { sudo apt-get update -qq; sudo apt-get -f install -y; }
          else
            echo "Cache miss — descargando paquetes de LibreOffice."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives="$HOME/lo-apt-debs" libreoffice-calc
            sudo chown -R "$USER" ~/lo-apt-debs
            rm -rf ~/lo-apt-debs/partial ~/lo-apt-debs/lock
          fi

      # OOXMLRecalcMode=0 forces a FULL recalculation on load — without it,
      # headless LibreOffice only partially recalculates xlsx files, leaving
      # some point cells with stale cached values. This makes the output
      # identical to opening the file in Excel and enabling editing.
      - name: Recalculate formulas on temp copies
        run: |
          mkdir -p /tmp/recalc/out /tmp/louser/user
          cat > /tmp/louser/user/registrymodifications.xcu <<'XCU'
          <?xml version="1.0" encoding="UTF-8"?>
          <oor:items xmlns:oor="http://openoffice.org/2001/registry" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
           <item oor:path="/org.openoffice.Office.Calc/Formula/Load"><prop oor:name="OOXMLRecalcMode" oor:op="fuse"><value>0</value></prop></item>
           <item oor:path="/org.openoffice.Office.Calc/Formula/Load"><prop oor:name="ODFRecalcMode" oor:op="fuse"><value>0</value></prop></item>
          </oor:items>
          XCU
          cp ADMINExcelMundial2026*.xlsx /tmp/recalc/
          for FILE in /tmp/recalc/*.xlsx; do
            echo "Recalculating $(basename "$FILE") …"
            libreoffice --headless --norestore -env:UserInstallation=file:///tmp/louser \
              --convert-to xlsx --outdir /tmp/recalc/out "$FILE"
          done

      - name: Convert Excel to JSON
        run: python scripts/excel_to_json.py
        env:
          EXCEL_DIR: /tmp/recalc/out

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update dashboard data from Excel"
            git push
          fi
